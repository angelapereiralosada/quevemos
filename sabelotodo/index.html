<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabelotodo · Trivial en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --tilt:54deg; --rz:0deg;
  --ink:#24164f; --violet:#5b3fd6; --cream:#fff8ec;
  --disp:'Lilita One','Figtree',system-ui,sans-serif; --ui:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(10px, calc(0.9vmin + 0.4vmax), 28px)}
html,body{height:100%;overflow:hidden;font-family:var(--ui);color:var(--ink);background:#7cc8ff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit;user-select:text}

/* ================= CIELO ================= */
#sky{position:fixed;inset:0;background:linear-gradient(180deg,#4FAEFF 0%,#8CD0FF 38%,#C9E9FF 62%,#FFE2EF 100%);overflow:hidden}
.sun{position:absolute;right:9%;top:6%;width:30vmin;height:30vmin;border-radius:50%;background:radial-gradient(circle,#fffbe3 0 22%,rgba(255,246,200,.75) 34%,rgba(255,240,200,.25) 52%,transparent 70%)}
.cloud{position:absolute;left:0;width:var(--w);height:calc(var(--w)*.45);opacity:var(--o,1);animation:drift var(--t) linear infinite;animation-delay:var(--d)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:999px}
.cloud::before{left:8%;right:8%;bottom:0;height:45%}
.cloud::after{left:22%;bottom:18%;width:38%;height:75%;border-radius:50%;box-shadow:calc(var(--w)*.25) calc(var(--w)*.05) 0 calc(var(--w)*-.03) #fff,calc(var(--w)*-.12) calc(var(--w)*.08) 0 calc(var(--w)*-.06) #fff}
.cloud i{position:absolute;inset:auto 6% -8% 6%;height:30%;border-radius:999px;background:rgba(150,185,235,.35);filter:blur(4px)}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.isle-far{position:absolute;width:var(--w);aspect-ratio:3/1.4;opacity:.55;filter:blur(1.5px);animation:float 7s ease-in-out infinite;animation-delay:var(--d)}
.isle-far::before{content:"";position:absolute;left:0;right:0;top:0;height:28%;border-radius:50%;background:#8fd77a}
.isle-far::after{content:"";position:absolute;left:12%;right:12%;top:14%;bottom:0;background:linear-gradient(#b98a62,#8a6a8f);clip-path:polygon(0 0,100% 0,80% 45%,58% 100%,38% 60%,18% 40%)}
@keyframes float{50%{transform:translateY(-1.2rem)}}

/* ================= ESCENA 3D ================= */
#scene{position:fixed;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;perspective:2300px;perspective-origin:50% 18%;transform:scale(var(--fit,1))}
#board{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.5,.05,.2,1)}
#board.fast{transition-duration:.5s}
#spin{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateZ(var(--rz))}
.p3{transform-style:preserve-3d}
.island{position:absolute;inset:0;border-radius:120px;transform-style:preserve-3d;
  background:
   radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 3px,transparent 4px) 0 0/46px 46px,
   radial-gradient(circle at 70% 60%,rgba(40,110,40,.18) 0 3px,transparent 4px) 0 0/38px 38px,
   radial-gradient(ellipse at 50% 40%,#9BE07F 0%,#7CCB62 60%,#62B24E 100%);
  box-shadow:inset 0 0 0 14px rgba(255,255,255,.22),inset 0 0 0 26px rgba(80,160,60,.25)}
.cliff{position:absolute;background:linear-gradient(180deg,#5aa646 0,#5aa646 7%,#c98f5e 7%,#b0754a 38%,#8c5c49 70%,#6b4a63 100%)}
.cliff.front{left:110px;right:110px;top:100%;height:330px;transform-origin:top;transform:rotateX(-90deg);
  clip-path:polygon(0 0,100% 0,100% 22%,93% 30%,86% 44%,78% 50%,70% 68%,61% 74%,54% 96%,47% 100%,40% 82%,31% 70%,24% 52%,14% 44%,6% 30%,0 22%)}
.cliff.left,.cliff.right{top:110px;bottom:110px;width:330px;transform-origin:left;transform:rotateY(90deg);
  background:linear-gradient(90deg,#4e963c 0,#4e963c 7%,#b07b52 7%,#956445 38%,#7a5142 70%,#5d405a 100%);
  clip-path:polygon(0 0,22% 0,32% 10%,46% 22%,52% 38%,70% 46%,80% 60%,64% 78%,48% 88%,30% 100%,0 100%)}
.cliff.left{left:0}.cliff.right{left:100%}
.isle-shadow{position:absolute;left:8%;right:8%;top:104%;height:42%;border-radius:50%;background:radial-gradient(ellipse,rgba(40,60,140,.22),transparent 70%);transform:translateZ(-420px)}

/* Casillas */
.tile{position:absolute;width:108px;height:108px;transform-style:preserve-3d}
.tile .gnd{position:absolute;inset:-4px -4px -10px;border-radius:30px;background:rgba(30,80,20,.38);filter:blur(5px);transform:translateZ(1px)}
.tile .side{position:absolute;left:10px;right:10px;top:100%;height:20px;transform-origin:top;transform:rotateX(90deg);background:var(--td);border-radius:0 0 12px 12px}
.tile .sideL,.tile .sideR{position:absolute;top:10px;bottom:10px;width:20px;transform-origin:left;transform:rotateY(-90deg);background:var(--td);filter:brightness(.85)}
.tile .sideL{left:0}.tile .sideR{left:100%}
.tile .top{position:absolute;inset:0;border-radius:28px;transform:translateZ(20px);display:grid;place-items:center;
  background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.65),rgba(255,255,255,0) 44%),radial-gradient(circle at 70% 85%,rgba(0,0,0,.12),transparent 55%),var(--tc);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.92),inset 0 0 0 9px rgba(0,0,0,.06)}
.tile .ic{font-size:50px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.tile .lab{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile.hot .top{animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:inset 0 0 0 6px #fff,0 0 0 8px rgba(255,255,255,.9),0 0 40px 14px rgba(255,255,255,.8)}}
.plaza{position:absolute;border-radius:60px;transform-style:preserve-3d}
.plaza .top{position:absolute;inset:0;border-radius:60px;transform:translateZ(14px);background:radial-gradient(circle at 30% 20%,#fff,#fff3dc 60%,#f6e3c0);box-shadow:inset 0 0 0 8px #fff,inset 0 0 0 12px rgba(91,63,214,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.plaza .side{position:absolute;left:30px;right:30px;top:100%;height:14px;transform-origin:top;transform:rotateX(90deg);background:#d9bf93;border-radius:0 0 14px 14px}
.plaza .gnd{position:absolute;inset:-6px -6px -14px;border-radius:66px;background:rgba(30,80,20,.35);filter:blur(7px);transform:translateZ(1px)}
.plaza .t1{font-family:var(--disp);font-size:92px;line-height:1;color:var(--violet);letter-spacing:1px;text-shadow:0 5px 0 #c9b8ff}
.plaza .t2{font-weight:800;font-size:24px;color:#7a6aa8}
.pond{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#bff1ff 0 12%,#58c8f0 40%,#2f9fd8 100%);box-shadow:0 0 0 8px #e9f7d9,0 0 0 11px rgba(0,0,0,.06);transform:translateZ(2px)}
.flower{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--fc);box-shadow:0 0 0 3px #fff;transform:translateZ(2px)}

/* Elementos de pie (miran a cámara) */
.bb{position:absolute;width:0;height:0;transform-style:preserve-3d}
.bb .fig{position:absolute;bottom:0;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--tilt) * -1))}
.bb .shd{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(20,50,10,.42),transparent 70%);transform:translateZ(1px)}
.tree .fig{left:-50px;width:100px;height:150px}
.tree .shd{width:110px;height:50px;left:-55px;top:-25px}
.pawn{z-index:5}
.pawn .fig{left:-42px;width:84px;height:128px}
.pawn .fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pawn .face{position:absolute;left:50%;top:13%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.pawn .shd{width:80px;height:44px;left:-40px;top:-22px}
.pawn .ring{position:absolute;width:118px;height:118px;left:-59px;top:-59px;border-radius:50%;border:7px solid var(--pc);transform:translateZ(1px);opacity:0}
.pawn.active .ring{opacity:1;animation:ring 1.3s ease-in-out infinite}
@keyframes ring{0%{transform:translateZ(1px) scale(.7);opacity:1}100%{transform:translateZ(1px) scale(1.25);opacity:0}}
.pawn.active .fig{filter:drop-shadow(0 0 10px #fff)}

/* ================= HUD ================= */
.ui{position:fixed;z-index:10}
#hud{top:1.4rem;left:1.6rem;right:1.6rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;pointer-events:none;transition:opacity .4s,transform .4s}
#hud.off{opacity:0;transform:translateY(-3rem)}
.tc{display:flex;align-items:center;gap:.8rem;padding:.55rem 1.1rem .55rem .55rem;border-radius:99rem;background:rgba(255,255,255,.88);box-shadow:0 .35rem 0 rgba(36,22,79,.12),0 .8rem 1.6rem rgba(36,22,79,.12);transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.tc .hd{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:1.8rem;box-shadow:inset 0 -.25rem 0 rgba(0,0,0,.15)}
.tc .nm{font-weight:900;font-size:1.25rem;max-width:10rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .st{display:flex;gap:.3rem;margin-top:.15rem}
.tc .st i{width:1.05rem;height:1.05rem;border-radius:50%;background:#e6e1f5;box-shadow:inset 0 .12rem 0 rgba(0,0,0,.08)}
.tc .st i.on{background:var(--sc);box-shadow:inset 0 -.15rem 0 rgba(0,0,0,.2),0 0 .5rem var(--sc)}
.tc .cnt{font-family:var(--disp);font-size:1.5rem;color:var(--violet);margin-left:.2rem}
.tc.active{transform:scale(1.12) translateY(.3rem);box-shadow:0 0 0 .3rem var(--pc),0 .8rem 1.8rem rgba(36,22,79,.25)}
#gear{top:1.4rem;right:1.6rem;width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:1.4rem;cursor:pointer;box-shadow:0 .35rem 0 rgba(36,22,79,.12)}

/* Pulsador (ayuda de control) */
#hint{left:50%;bottom:1.6rem;transform:translateX(-50%);display:flex;align-items:center;gap:1.4rem;padding:.7rem 1.6rem .7rem .8rem;border-radius:99rem;background:rgba(255,255,255,.94);box-shadow:0 .4rem 0 rgba(36,22,79,.14),0 1rem 2rem rgba(36,22,79,.18);font-weight:800;font-size:1.25rem;transition:opacity .3s;pointer-events:none;overflow:hidden}
#hint.off{opacity:0}
#hint .k{display:flex;align-items:center;gap:.6rem}
#hint .btn{width:2.4rem;height:2.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8283c 60%,#b3122a);box-shadow:0 .25rem 0 #7d0b1d;transition:transform .1s}
#hint .k.hold .btn{box-shadow:0 .25rem 0 #7d0b1d,0 0 0 .3rem #fff,0 0 0 .5rem #e8283c}
#hint .k b{font-weight:600;color:#7a6aa8;margin-right:.2rem}
#hint .sep{width:2px;height:1.8rem;background:#e6e1f5}
#holdbar{position:absolute;left:0;bottom:0;height:.35rem;width:0;background:#e8283c}
body.charging #holdbar{width:100%;transition:width .65s linear}
body.pressing #hint .btn{transform:translateY(.2rem);box-shadow:0 .05rem 0 #7d0b1d}

/* ================= CAPAS ================= */
.layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .35s,visibility .35s;pointer-events:none}
.layer.show{visibility:visible;opacity:1;pointer-events:auto}

/* Portada */
#intro{z-index:15;align-content:start;padding-top:5vh}
.logo{font-family:var(--disp);font-size:min(11rem,16vw);line-height:.9;color:#fff;transform:rotate(-4deg);
  text-shadow:0 .05em 0 #7b5cf0,0 .1em 0 #5b3fd6,0 .15em 0 #4329a8,0 .26em .3em rgba(36,22,79,.35)}
.tag{margin-top:2.6rem;justify-self:center;background:#fff;color:var(--violet);font-weight:900;font-size:1.7rem;padding:.6rem 1.8rem;border-radius:99rem;box-shadow:0 .4rem 0 #c9b8ff;transform:rotate(2deg)}
#intro.show .logo{animation:drop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-60vh) rotate(-20deg)}100%{transform:rotate(-4deg)}}

/* Configuración */
#setup{z-index:15}
.panel{width:min(62rem,92vw);background:rgba(255,255,255,.95);border-radius:2.4rem;padding:2rem 2.4rem 2.2rem;box-shadow:0 .7rem 0 rgba(36,22,79,.12),0 2rem 4rem rgba(36,22,79,.25);display:flex;flex-direction:column;gap:.9rem}
.panel h2{font-family:var(--disp);font-weight:400;font-size:3rem;color:var(--violet);line-height:1}
.panel .sub{font-weight:600;color:#7a6aa8;font-size:1.15rem;margin-top:-.3rem}
.srow{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-radius:1.4rem;border:.22rem solid transparent;transition:border-color .2s,background .2s}
.srow.cur{border-color:var(--violet);background:#f4f0ff}
.srow .lbl{width:12rem;font-weight:900;font-size:1.35rem;flex:none}
.chips{display:flex;gap:.6rem;flex-wrap:wrap}
.chip{border:0;border-radius:99rem;padding:.55rem 1.2rem;background:#efeaff;color:var(--ink);font-family:var(--ui);font-weight:800;font-size:1.25rem;cursor:pointer}
.chip.on{background:var(--violet);color:#fff;box-shadow:0 .25rem 0 #3a26a0}
.teamlist{display:flex;gap:.7rem;flex-wrap:wrap}
.tchip{display:flex;align-items:center;gap:.5rem;background:#fff;border-radius:99rem;padding:.3rem .8rem .3rem .3rem;box-shadow:inset 0 0 0 .18rem #efeaff}
.tchip .hd{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:1.3rem}
.tchip input{border:0;background:transparent;font-weight:800;font-size:1.1rem;width:8.5rem;outline:none}
.tchip input:focus{box-shadow:0 .15rem 0 var(--violet)}
.go{justify-content:center;margin-top:.4rem}
.go .play{font-family:var(--disp);font-size:2.4rem;color:#fff;background:linear-gradient(180deg,#ff6b7d,#e8283c);border:0;border-radius:99rem;padding:.7rem 3.4rem;box-shadow:0 .45rem 0 #9e1428;cursor:pointer}
.srow.go.cur{background:transparent;border-color:transparent}
.srow.go.cur .play{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.how{display:flex;gap:2rem;justify-content:center;font-weight:700;color:#7a6aa8;font-size:1.1rem;margin-top:.2rem}
.how span{display:flex;align-items:center;gap:.5rem}
.how i{width:1.4rem;height:1.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8283c 60%,#b3122a)}

/* Turno */
#turn{z-index:12;align-content:start;padding-top:15vh;pointer-events:none}
.tbanner{display:flex;align-items:center;gap:1.2rem;padding:.8rem 2.4rem .8rem .8rem;border-radius:99rem;background:var(--pc);box-shadow:0 .5rem 0 var(--pd),0 1.4rem 2.6rem rgba(36,22,79,.3)}
.tbanner .hd{width:5.4rem;height:5.4rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:3.2rem}
.tbanner .tx{color:#fff}
.tbanner .a{font-weight:800;font-size:1.3rem;opacity:.9}
.tbanner .b{font-family:var(--disp);font-size:3.6rem;line-height:1;text-shadow:0 .2rem 0 rgba(0,0,0,.18)}
#turn.show .tbanner{animation:slideIn .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slideIn{0%{transform:translateY(-12rem) scale(.6)}100%{transform:none}}

/* Dado */
#dice{z-index:25;pointer-events:none}
.dwrap{perspective:1200px;display:grid;place-items:center}
.dbounce{transform-style:preserve-3d}
.cube{position:relative;width:11rem;height:11rem;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.15,.8,.25,1)}
.cube .f{position:absolute;inset:0;border-radius:2rem;background:radial-gradient(circle at 30% 25%,#fff,#f3efff 70%,#e2dbff);box-shadow:inset 0 0 0 .3rem #fff,inset 0 -.6rem 1rem rgba(91,63,214,.18);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.5rem;backface-visibility:hidden}
.cube .f span{border-radius:50%;margin:.35rem;background:transparent}
.cube .f span.p{background:radial-gradient(circle at 35% 30%,#6f55e8,#2c1a7a)}
.f1{transform:translateZ(5.5rem)}.f6{transform:rotateY(180deg) translateZ(5.5rem)}
.f3{transform:rotateY(90deg) translateZ(5.5rem)}.f4{transform:rotateY(-90deg) translateZ(5.5rem)}
.f5{transform:rotateX(90deg) translateZ(5.5rem)}.f2{transform:rotateX(-90deg) translateZ(5.5rem)}
.dshadow{width:12rem;height:2.4rem;border-radius:50%;background:radial-gradient(ellipse,rgba(36,22,79,.35),transparent 70%);margin-top:2.2rem}
.dnum{position:absolute;font-family:var(--disp);font-size:9rem;color:#fff;text-shadow:0 .4rem 0 var(--violet),0 1rem 2rem rgba(36,22,79,.4);opacity:0}
#dice.done .dnum{animation:numPop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes numPop{0%{opacity:0;transform:translate(9rem,-6rem) scale(.3)}100%{opacity:1;transform:translate(9rem,-6rem) scale(1)}}

/* Pregunta */
#qlay{z-index:22;background:radial-gradient(ellipse at center,rgba(36,22,79,.15),rgba(36,22,79,.55))}
.qcard{position:relative;width:min(80rem,92vw);background:#fff;border-radius:2.6rem;overflow:hidden;box-shadow:0 .9rem 0 rgba(36,22,79,.18),0 3rem 6rem rgba(36,22,79,.45)}
#qlay.show .qcard{animation:cardIn .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardIn{0%{transform:perspective(1400px) rotateX(70deg) translateY(30vh) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.qhead{display:flex;align-items:center;gap:1.1rem;padding:1.2rem 2.2rem;background:radial-gradient(circle at 15% 0,rgba(255,255,255,.35),transparent 50%),var(--cc);color:#fff}
.qhead .ci{width:4.4rem;height:4.4rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.6rem;box-shadow:0 .25rem 0 rgba(0,0,0,.15)}
.qhead .cn{font-family:var(--disp);font-size:2.6rem;text-shadow:0 .2rem 0 rgba(0,0,0,.15)}
.qhead .lv{display:flex;gap:.3rem;margin-left:.4rem}
.qhead .lv i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(255,255,255,.4)}
.qhead .lv i.on{background:#fff}
.qhead .who{margin-left:auto;display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.95);color:var(--ink);border-radius:99rem;padding:.35rem 1.1rem .35rem .35rem;font-weight:900;font-size:1.2rem}
.qhead .who .hd{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:1.5rem}
.qbody{padding:2rem 2.4rem 2.4rem}
#qText{font-weight:900;font-size:3rem;line-height:1.14;letter-spacing:-.01em;margin-bottom:1.7rem;max-width:58ch}
#qText.long{font-size:2.45rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.opt{position:relative;display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;border-radius:1.5rem;background:#f4f1ff;font-weight:800;font-size:1.95rem;line-height:1.15;border:.3rem solid transparent;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s,opacity .3s}
.opt .l{position:relative;z-index:1;flex:none;width:3.3rem;height:3.3rem;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:1.7rem;box-shadow:inset 0 -.2rem 0 rgba(0,0,0,.18)}
.opt .t{position:relative;z-index:1}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--pcl)}
.opt.sel{border-color:var(--pc);background:#fff;transform:scale(1.035);box-shadow:0 .5rem 1.2rem rgba(36,22,79,.15)}
.opt.sel::after{content:"";position:absolute;right:1.2rem;top:50%;width:1.4rem;height:1.4rem;margin-top:-.7rem;border-radius:50%;background:var(--pc);animation:blinkdot .9s ease-in-out infinite}
@keyframes blinkdot{50%{transform:scale(.5);opacity:.4}}
body.charging .opt.sel::before{width:100%;transition:width .65s linear}
.opt.right{background:#2fcb6e;color:#fff;border-color:#1fa857;transform:scale(1.05)}
.opt.right .l{background:#fff;color:#1fa857}
.opt.wrong{background:#ff5a5f;color:#fff;border-color:#d63a40;animation:shake .45s}
.opt.right::after,.opt.wrong::after{display:none}
.opt.fade{opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-.8rem)}40%,80%{transform:translateX(.8rem)}}
.verdict{position:absolute;right:2.6rem;top:6.6rem;font-family:var(--disp);font-size:5.4rem;color:var(--vc,#2fcb6e);transform:rotate(-8deg);opacity:0;pointer-events:none;-webkit-text-stroke:.12em #fff;paint-order:stroke fill;filter:drop-shadow(0 .3rem .4rem rgba(36,22,79,.3))}
.verdict.on{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.qmsg{margin-top:1.4rem;min-height:2.4rem;font-weight:800;font-size:1.5rem;color:#7a6aa8;text-align:center}
.qmsg b{color:var(--ink)}

/* Elegir categoría */
#pick{z-index:22;background:radial-gradient(ellipse at center,rgba(36,22,79,.15),rgba(36,22,79,.55))}
.pickbox{display:flex;flex-direction:column;align-items:center;gap:2rem}
.pickbox h3{font-family:var(--disp);font-weight:400;font-size:4rem;color:#fff;text-shadow:0 .3rem 0 var(--violet)}
.pcats{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center}
.pcat{width:11rem;height:12rem;border-radius:2rem;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.6),transparent 45%),var(--cc);box-shadow:inset 0 0 0 .35rem rgba(255,255,255,.9),0 .5rem 0 rgba(36,22,79,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;color:#fff;font-family:var(--disp);font-size:1.5rem;text-align:center;line-height:1.05;padding:.6rem;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pcat .e{font-size:4rem}
.pcat.sel{transform:translateY(-1rem) scale(1.1);box-shadow:inset 0 0 0 .35rem #fff,0 0 0 .4rem var(--ink),0 1.2rem 2rem rgba(36,22,79,.35)}
.pcat.got{opacity:.55}

/* Aviso central */
#pop{z-index:24;pointer-events:none}
.popt{font-family:var(--disp);font-size:7rem;color:#fff;text-align:center;line-height:1;text-shadow:0 .08em 0 var(--violet),0 .16em 0 #3a26a0,0 .3em .4em rgba(36,22,79,.35);transform:rotate(-4deg)}
.popt small{display:block;font-family:var(--ui);font-weight:900;font-size:1.8rem;text-shadow:0 .15rem 0 var(--violet);margin-top:1rem}
#pop.show .popt{animation:stamp2 .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp2{0%{transform:rotate(-4deg) scale(2.6);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}

/* Estrella voladora */
.flystar{position:fixed;z-index:40;width:4rem;height:4rem;margin:-2rem 0 0 -2rem;border-radius:50%;background:var(--sc);box-shadow:0 0 0 .3rem #fff,0 0 2rem var(--sc);display:grid;place-items:center;font-size:2.2rem;pointer-events:none}

/* Victoria */
#win{z-index:30;overflow:hidden}
#win .rays{position:absolute;left:50%;top:45%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(from 0deg,var(--pc) 0 8deg,var(--pl) 8deg 16deg);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:1rem}
.wpawn{width:13rem;height:20rem;position:relative;animation:hop2 1s ease-in-out infinite}
.wpawn svg{width:100%;height:100%;overflow:visible}
.wpawn .face{position:absolute;left:50%;top:13%;width:6.2rem;height:6.2rem;margin-left:-3.1rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:4.2rem}
@keyframes hop2{50%{transform:translateY(-2rem)}}
.wt{font-family:var(--disp);font-size:6.4rem;color:#fff;line-height:1;text-shadow:0 .08em 0 rgba(0,0,0,.2),0 .25em .4em rgba(0,0,0,.2);text-align:center}
.rank{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.rank .tc{transform:none}

/* Confeti */
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}

@media (prefers-reduced-motion:reduce){.cloud,.isle-far,#win .rays{animation:none!important}}
</style>
</head>

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d=.15,type='sine',v=.2,t0=0,f2){const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d=.05,v=.2,t0=0,freq=2000){const a=ac();if(!a)return;const t=a.currentTime+t0;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t)}

const CF=(()=>{const cv=$('#confetti'),cx=cv.getContext('2d');let Wd,Hd,d=1,P=[],run=false,until=0;
  function rs(){d=Math.min(devicePixelRatio||1,2);Wd=cv.width=innerWidth*d;Hd=cv.height=innerHeight*d}rs();addEventListener('resize',rs);
  const pal=['#FF4D6D','#3A86FF','#FFBE0B','#55C443','#9B5DE5','#FF7F11','#fff'];
  function add(x,y,vx,vy,cols){P.push({x,y,vx,vy,r:(Math.random()*8+7)*d,a:Math.random()*6.3,va:(Math.random()-.5)*.3,c:rnd(cols||pal),sh:Math.random()<.6,w:Math.random()*.05,l:1})}
  function burst(x,y,n=130,cols){x*=d;y*=d;for(let i=0;i<n;i++){const an=Math.random()*6.3,sp=(Math.random()*15+6)*d;add(x,y,Math.cos(an)*sp,Math.sin(an)*sp-7*d,cols)}go()}
  function rain(ms){until=performance.now()+ms;go()}
  function go(){if(!run){run=true;requestAnimationFrame(loop)}}
  function loop(t){if(t<until)for(let i=0;i<5;i++)add(Math.random()*Wd,-20,(Math.random()-.5)*4*d,Math.random()*4*d+2*d);
    cx.clearRect(0,0,Wd,Hd);for(const p of P){p.vy+=.36*d;p.vx*=.985;p.vy*=.985;p.x+=p.vx+Math.sin(p.a*2)*p.w*20;p.y+=p.vy;p.a+=p.va;if(p.y>Hd+30)p.l=0;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;if(p.sh)cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2*Math.abs(Math.cos(p.a*3))+2);else{cx.beginPath();cx.arc(0,0,p.r/2.4,0,6.3);cx.fill()}cx.restore()}
    P=P.filter(p=>p.l);if(P.length||t<until)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,Wd,Hd)}}
  return{burst,rain}})();

let path=[];for(let c=0;c<COLS;c++)path.push([c,0]);for(let r=1;r<ROWS;r++)path.push([COLS-1,r]);for(let c=COLS-2;c>=0;c--)path.push([c,ROWS-1]);for(let r=ROWS-2;r>=1;r--)path.push([0,r]);
const startIdx=path.findIndex(([c,r])=>c===4&&r===ROWS-1);path=path.slice(startIdx).concat(path.slice(0,startIdx));
const N=path.length;
const TILES=path.map((p,i)=>{if(i===0)return{type:'start'};if(i===7||i===21)return{type:'again'};if(i===14)return{type:'choose'};return{type:'cat'}});
{let k=0;TILES.forEach(t=>{if(t.type==='cat'){t.cat=[0,2,4,1,3,5][k%6];k++}})}
function cxy(c,r){return[M+c*P+P/2,M+r*P+P/2]}
function tileXY(i){const[c,r]=path[i];return cxy(c,r)}

function buildPawns(){
  const box=$('#pawns');box.innerHTML='';
  S.teams.forEach((t,i)=>{const el=document.createElement('div');el.className='bb pawn';el.style.setProperty('--pc',t.color);
    el.innerHTML=`<div class="ring"></div><div class="shd"></div><div class="fig">${pawnSVG(t,i)}<span class="face">${t.emoji}</span></div>`;
    box.appendChild(el);t.el=el;t.fig=el.querySelector('.fig');t.shd=el.querySelector('.shd')});
  layoutPawns(false);
}
function pawnPos(t){const act=S.teams[S.turn];const same=S.teams.filter(o=>o.pos===t.pos&&o!==act);if(act&&act.pos===t.pos)same.push(act);const k=same.indexOf(t),n=same.length;let[x,y]=tileXY(t.pos);
  if(n>1){const a=Math.PI/2+(k+1)*2*Math.PI/n;x+=Math.cos(a)*24;y+=Math.sin(a)*20}return[x,y]}
function layoutPawns(anim=true){S.teams.forEach(t=>{const[x,y]=pawnPos(t);const to=`translate3d(${x}px,${y}px,${TH}px)`;const from=t.el.style.transform||to;t.el.style.transform=to;if(anim&&from!==to)t.el.animate([{transform:from},{transform:to}],{duration:300,easing:'ease-out'})})}
const FIG=`rotateX(calc(var(--tilt) * -1))`;
async function hop(t){
  const from=t.el.style.transform;t.pos=(t.pos+1)%N;const[x,y]=tileXY(t.pos);const to=`translate3d(${x}px,${y}px,${TH}px)`;t.el.style.transform=to;
  camOn(t.pos,true);SFX.hop();
  t.el.animate([{transform:from},{transform:to}],{duration:380,easing:'ease-in-out'});
  t.fig.animate([{transform:`translateZ(0) ${FIG} scale(1,1)`},{transform:`translateZ(0) ${FIG} scale(1.12,.86)`,offset:.1},{transform:`translateZ(85px) ${FIG} scale(.94,1.08)`,offset:.5},{transform:`translateZ(0) ${FIG} scale(1.15,.85)`,offset:.9},{transform:`translateZ(0) ${FIG} scale(1,1)`}],{duration:380,easing:'ease-in-out'});
  t.shd.animate([{transform:'translateZ(1px) scale(1)',opacity:1},{transform:'translateZ(1px) scale(.55)',opacity:.4,offset:.5},{transform:'translateZ(1px) scale(1)',opacity:1}],{duration:380});

function act(k){
  if(S.busy)return;
  const st=S.state;
  if(st==='intro'){SFX.tap();goSetup();return}
  if(st==='setup'){k==='tap'?setupNext():setupHold();return}
  if(st==='turn'){roll();return}
  if(st==='question'){if(k==='tap')moveSel(1);else answer(S.sel);return}
  if(st==='result'){afterResult();return}
  if(st==='pick'){if(k==='tap')movePick(1);else choosePick();return}
  if(st==='win'){k==='tap'?startGame():goSetup();return}
}

  $$('#cDiff .chip').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;SFX.tap();save();renderSetup()});
  $$('#cGoal .chip').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;SFX.tap();save();renderSetup()});

function setupNext(){S.row=(S.row+1)%ROWS_S.length;SFX.tap();renderSetup()}
function setupHold(){const r=ROWS_S[S.row];SFX.hold();
  if(r==='teams')S.nTeams=S.nTeams>=6?2:S.nTeams+1;
  else if(r==='diff'){const i=DIFFS.findIndex(d=>d.v===S.diff);S.diff=DIFFS[(i+1)%DIFFS.length].v}
  else if(r==='goal'){const i=GOALS.indexOf(S.goal);S.goal=GOALS[(i+1)%GOALS.length]}
  else if(r==='go'){startGame();return}
  save();renderSetup()}
$('#playBtn').onclick=()=>{ac();startGame()};
$('#gear').onclick=()=>goSetup();

/* ================= PARTIDA ================= */
function startGame(){
  closeAll();stopOrbit();save();
  S.teams=TEAMS.slice(0,S.nTeams).map((t,i)=>({...t,name:(S.names[i]||t.name).trim()||t.name,pos:0,stars:new Set(),right:0}));
  S.turn=0;S.used={};
  buildPawns();renderHUD();$('#hud').classList.remove('off');$('#gear').style.display='';
  SFX.hold();camOverview();
  S.busy=true;setTimeout(()=>{S.busy=false;beginTurn()},900);
}
function cur(){return S.teams[S.turn]}
function beginTurn(again){
  const t=cur();S.state='turn';setActive();layoutPawns();renderHUD();camOn(t.pos);
  const b=$('#tban');b.style.setProperty('--pc',t.color);b.style.setProperty('--pd',t.dark);
  b.innerHTML=`<div class="hd">${t.emoji}</div><div class="tx"><div class="a">${again?'Seguís tirando':'Le toca a'}</div><div class="b">${esc(t.name)}</div></div>`;
  layer('turn',false);void b.offsetWidth;layer('turn',true);
  hint('tirar el dado','');
}

/* ---- Dado ---- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],5:[-90,0],2:[90,0]};
$('#cube').innerHTML=[1,2,3,4,5,6].map(n=>`<div class="f f${n}">${Array.from({length:9},(_,i)=>`<span class="${PIPS[n].includes(i)?'p':''}"></span>`).join('')}</div>`).join('');
let drot={x:-20,y:25};
async function roll(){
  S.busy=true;S.state='rolling';layer('turn',false);hint('','');
  const v=1+Math.random()*6|0;const cube=$('#cube'),dl=$('#dice');
  dl.classList.remove('done');$('#dnum').textContent=v;
  cube.style.transition='none';cube.style.transform=`rotateX(${drot.x}deg) rotateY(${drot.y}deg)`;
  layer('dice',true);SFX.dice();
  $('#dbounce').animate([{transform:'translateY(-70vh) scale(.6)'},{transform:'translateY(0) scale(1)',offset:.45},{transform:'translateY(-14vh) scale(1)',offset:.62},{transform:'translateY(0) scale(1)',offset:.8},{transform:'translateY(-3vh)',offset:.9},{transform:'translateY(0)'}],{duration:1400,easing:'ease-out'});
  await wait(30);
  const [fx,fy]=FACE[v];const bx=Math.ceil(drot.x/360)*360+720,by=Math.ceil(drot.y/360)*360+1080;
  drot={x:bx+fx-14,y:by+fy+20};cube.style.transition='';cube.style.transform=`rotateX(${drot.x}deg) rotateY(${drot.y}deg)`;
  await wait(1450);dl.classList.add('done');SFX.land();
  await wait(900);layer('dice',false);
  const t=cur();
  for(let i=0;i<v;i++)await hop(t);
  SFX.land();layoutPawns();
  const tile=TILES[t.pos];$('#t'+t.pos).classList.add('hot');
  await wait(600);S.busy=false;land(tile);
}
function land(tile){
  if(tile.type==='cat')return ask(tile.cat);
  if(tile.type==='again'){popMsg('¡Tira otra vez!','Casilla de dado');return setTimeout(()=>{clearHot();beginTurn(true)},1700)}
  openPick(tile.type==='start'?'¡Vuelta completa!':'Tú eliges');
}
function clearHot(){$$('.tile.hot').forEach(t=>t.classList.remove('hot'))}
function popMsg(a,b){$('#popt').innerHTML=`${a}${b?`<small>${b}</small>`:''}`;layer('pop',false);void $('#popt').offsetWidth;layer('pop',true);setTimeout(()=>layer('pop',false),1500)}

/* ---- Elegir categoría ---- */
function openPick(title){S.state='pick';const t=cur();S.pickSel=CATS.findIndex((c,j)=>!t.stars.has(j));if(S.pickSel<0)S.pickSel=0;
  $('#pick h3').textContent=title+': ¿qué categoría?';
  $('#pcats').innerHTML=CATS.map((c,j)=>`<div class="pcat ${t.stars.has(j)?'got':''}" data-click data-j="${j}" style="--cc:${c.color}"><span class="e">${c.emoji}</span>${c.name}</div>`).join('');
  $$('.pcat').forEach(el=>el.onclick=()=>{S.pickSel=+el.dataset.j;renderPick();choosePick()});
  renderPick();layer('pick',true);hint('siguiente categoría','elegir')}
function renderPick(){$$('.pcat').forEach((el,j)=>el.classList.toggle('sel',j===S.pickSel))}
function movePick(d){S.pickSel=(S.pickSel+d+CATS.length)%CATS.length;SFX.tap();renderPick()}
function choosePick(){if(S.state!=='pick')return;SFX.hold();layer('pick',false);ask(S.pickSel)}

/* ---- Pregunta ---- */
function pickQ(ci,d){const id=CATS[ci].id,key=id+d,pool=Q[id][d];S.used[key]=S.used[key]||[];if(S.used[key].length>=pool.length)S.used[key]=[];
  const av=pool.map((_,i)=>i).filter(i=>!S.used[key].includes(i));const i=rnd(av);S.used[key].push(i);const[q,c,...w]=pool[i];const o=shuffle([c,...w]);return{q,opts:o,correct:o.indexOf(c),answer:c,cat:ci,d}}
function ask(ci){
  const d=S.diff==='x'?rnd(['f','m','d']):S.diff;const q=S.q=pickQ(ci,d);const c=CATS[ci],t=cur();
  S.state='question';S.sel=0;
  const card=$('#qcard');card.style.setProperty('--cc',c.color);card.style.setProperty('--pc',t.color);card.style.setProperty('--pcl',lighten(t.color,.75));
  const lvl={f:1,m:2,d:3}[d];
  $('#qhead').innerHTML=`<span class="ci">${c.emoji}</span><span class="cn">${c.name}</span><span class="lv" title="Dificultad">${[1,2,3].map(n=>`<i class="${n<=lvl?'on':''}"></i>`).join('')}</span><span class="who"><span class="hd">${t.emoji}</span>Responden ${esc(t.name)}</span>`;
  const qt=$('#qText');qt.textContent=q.q;qt.classList.toggle('long',q.q.length>70);
  $('#opts').innerHTML=q.opts.map((o,i)=>`<div class="opt" data-click data-i="${i}"><span class="l">${'ABCD'[i]}</span><span class="t">${esc(o)}</span></div>`).join('');
  $$('.opt').forEach(el=>el.onclick=()=>{if(S.state!=='question')return;S.sel=+el.dataset.i;renderSel();answer(S.sel)});
  $('#qmsg').innerHTML='Toca para moverte entre respuestas y mantén pulsado para contestar';$('#verdict').className='verdict';
  renderSel();layer('qlay',true);SFX.reveal();hint('siguiente respuesta','responder');
}
function renderSel(){$$('.opt').forEach((el,i)=>el.classList.toggle('sel',i===S.sel))}
function moveSel(d){S.sel=(S.sel+d+4)%4;SFX.tap();renderSel()}
function answer(i){
  if(S.state!=='question')return;S.state='result';const q=S.q,t=cur(),ok=i===q.correct;S.lastOK=ok;
  $$('.opt').forEach((el,j)=>{el.classList.remove('sel');if(j===q.correct)el.classList.add('right');else if(j===i)el.classList.add('wrong');else el.classList.add('fade')});
  const v=$('#verdict');v.textContent=ok?rnd(CHEERS):rnd(FAILS);v.style.setProperty('--vc',ok?'#1fa857':'#e8283c');v.className='verdict on';
  const msg=$('#qmsg');
  if(ok){SFX.right();t.right++;const r=$$('.opt')[q.correct].getBoundingClientRect();CF.burst(r.left+r.width/2,r.top+r.height/2,120);
    const isNew=!t.stars.has(q.cat);
    if(isNew){t.stars.add(q.cat);flyStar(r.left+r.width/2,r.top,q.cat);msg.innerHTML=`¡Ganáis la estrella de <b>${CATS[q.cat].name}</b> y seguís tirando!`}
    else msg.innerHTML=`Esa estrella ya la teníais, pero <b>seguís tirando</b>`;
    if(t.stars.size>=S.goal){S.busy=true;setTimeout(()=>{S.busy=false;win()},2200);hint('','');return}
    hint('seguir tirando','');
  }else{SFX.wrong();msg.innerHTML=`La respuesta era <b>${esc(q.answer)}</b>`;hint('pasar al siguiente equipo','')}
}
function flyStar(x,y,ci){const el=document.createElement('div');el.className='flystar';el.style.setProperty('--sc',CATS[ci].color);el.textContent=CATS[ci].emoji;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  const tgt=$('#tc'+S.turn+' .st i:nth-child('+(ci+1)+')');const r=tgt?tgt.getBoundingClientRect():{left:innerWidth/2,top:0,width:0,height:0};
  const dx=r.left+r.width/2-x,dy=r.top+r.height/2-y;
  el.animate([{transform:'translate(0,0) scale(.3)'},{transform:`translate(${dx*.3}px,${dy*.3-160}px) scale(1.6)`,offset:.35},{transform:`translate(${dx}px,${dy}px) scale(.35)`}],{duration:1200,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{el.remove();SFX.star();renderHUD();const c=$('#tc'+S.turn);c&&c.animate([{transform:'scale(1.3)'},{transform:'scale(1.12) translateY(.3rem)'}],{duration:400})}}
function afterResult(){layer('qlay',false);clearHot();SFX.tap();
  if(S.lastOK)beginTurn(true);else{S.turn=(S.turn+1)%S.teams.length;beginTurn(false)}}

/* ---- Victoria ---- */
function win(){
  closeAll();S.state='win';const t=cur();renderHUD();
  const w=$('#win');w.style.setProperty('--pc',t.color);w.style.setProperty('--pl',lighten(t.color,.25));
  const rank=S.teams.slice().sort((a,b)=>b.stars.size-a.stars.size||b.right-a.right);
  $('#wbox').innerHTML=`<div class="wpawn">${pawnSVG(t,'w')}<span class="face">${t.emoji}</span></div><div class="wt">¡Ganan los ${esc(t.name)}!</div>
    <div class="rank">${rank.map(o=>`<div class="tc" style="--pc:${o.color}"><div class="hd">${o.emoji}</div><div><div class="nm">${esc(o.name)}</div><div class="st">${CATS.map((c,j)=>`<i class="${o.stars.has(j)?'on':''}" style="--sc:${c.color}"></i>`).join('')}</div></div><span class="cnt">${o.stars.size}</span></div>`).join('')}</div>`;
  layer('win',true);$('#hud').classList.add('off');SFX.fanfare();CF.rain(6000);
  hint('revancha','volver al menú');
}

/* ================= ARRANQUE ================= */
buildBoard();goIntro();
</script>
</body>
