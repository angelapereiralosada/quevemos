<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabelotodo · Trivial en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--tilt:52deg;--rz:0deg;--ink:#24164f;--violet:#5b3fd6;--team:#ffffff;--teamd:#cccccc;
  --disp:'Lilita One','Figtree',system-ui,sans-serif;--ui:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(10px, calc(0.9vmin + 0.4vmax), 28px)}
html,body{height:100%;overflow:hidden;font-family:var(--ui);color:var(--ink);background:#7cc8ff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit;user-select:text}

/* ================= CIELOS ================= */
#sky{position:fixed;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1s}
body[data-theme=classic] .sky.classic,body[data-theme=xmas] .sky.xmas,body[data-theme=uni] .sky.uni{opacity:1}
.sky.classic{background:linear-gradient(180deg,#4FAEFF 0%,#8CD0FF 40%,#CBEBFF 65%,#FFE4F0 100%)}
.sun{position:absolute;right:8%;top:5%;width:30vmin;height:30vmin;border-radius:50%;background:radial-gradient(circle,#fffbe3 0 22%,rgba(255,246,200,.7) 34%,rgba(255,240,200,.22) 52%,transparent 70%)}
.cloud{position:absolute;left:0;width:var(--w);height:calc(var(--w)*.45);opacity:var(--o,1);animation:drift var(--t) linear infinite;animation-delay:var(--d);--cc:#fff}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cc);border-radius:999px}
.cloud::before{left:8%;right:8%;bottom:0;height:45%}
.cloud::after{left:22%;bottom:18%;width:38%;height:75%;border-radius:50%;box-shadow:calc(var(--w)*.25) calc(var(--w)*.05) 0 calc(var(--w)*-.03) var(--cc),calc(var(--w)*-.12) calc(var(--w)*.08) 0 calc(var(--w)*-.06) var(--cc)}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.sky.xmas{background:linear-gradient(180deg,#071330 0%,#10255a 45%,#2a3f86 75%,#5a5aa8 100%)}
.stars{position:absolute;inset:0;background:radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/90px 90px,radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px) 40px 55px/130px 110px,radial-gradient(circle,#fff6c8 0 1.4px,transparent 2px) 70px 20px/210px 170px;opacity:.9}
.moon{position:absolute;right:10%;top:8%;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f4e7b8 60%,#e3d08f);box-shadow:0 0 6vmin 2vmin rgba(255,240,190,.35)}
.aurora{position:absolute;left:-10%;right:-10%;top:5%;height:40%;background:linear-gradient(100deg,transparent 10%,rgba(80,255,190,.18) 30%,rgba(120,160,255,.16) 50%,rgba(200,120,255,.14) 70%,transparent 90%);filter:blur(30px);animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(6%) skewY(-3deg)}}
.sky.uni{background:linear-gradient(180deg,#ffc9ec 0%,#e3c4ff 40%,#bfe3ff 72%,#d4ffe9 100%)}
.rainbow{position:absolute;left:50%;top:62%;width:150vmax;height:150vmax;margin-left:-75vmax;border-radius:50%;
  background:radial-gradient(circle,transparent 0 46%,rgba(255,99,132,.55) 46% 48%,rgba(255,170,80,.55) 48% 50%,rgba(255,226,90,.55) 50% 52%,rgba(110,220,130,.55) 52% 54%,rgba(90,170,255,.55) 54% 56%,rgba(170,120,255,.55) 56% 58%,transparent 58%);filter:blur(2px)}
.sky.uni .cloud{--cc:#fff3fb}

/* efectos (nieve / brillos) */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}

/* ================= ESCENA 3D ================= */
#scene{position:fixed;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;perspective:2300px;perspective-origin:50% 16%;transform:scale(var(--fit,1))}
#board{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.5,.05,.2,1)}
#board.fast{transition-duration:.42s;transition-timing-function:linear}
#spin{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateZ(var(--rz))}
.p3{transform-style:preserve-3d}
.disk{position:absolute;border-radius:50%;background:var(--diskTop);box-shadow:inset 0 0 0 10px rgba(255,255,255,.25),inset 0 0 0 22px rgba(0,0,0,.05)}
.rim{position:absolute;width:0;height:0;transform-style:preserve-3d}
.sl{position:absolute;top:0;transform-origin:50% 0;background:linear-gradient(180deg,var(--rimA) 0,var(--rimA) 14%,var(--rimB) 14%,var(--rimC) 100%)}
.dshadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(20,20,80,.25),transparent 70%)}
.track{position:absolute;border-radius:50%;transform:translateZ(1px)}
.spokeband{position:absolute;transform-origin:50% 0;transform:translateZ(1px);border-radius:30px}
.lights i{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;transform:translateZ(3px);animation:twk 1.2s steps(2) infinite}
.lights i:nth-child(odd){animation-delay:-.6s}
@keyframes twk{50%{filter:brightness(.35)}}

/* casillas */
.tile{position:absolute;transform-style:preserve-3d}
.tile .gnd{position:absolute;inset:-3px -3px -8px;border-radius:22px;background:rgba(10,20,40,.3);filter:blur(5px);transform:translateZ(1px)}
.tile .side{position:absolute;left:8px;right:8px;top:100%;height:20px;transform-origin:top;transform:rotateX(90deg);background:var(--td);border-radius:0 0 10px 10px}
.tile .sideT{position:absolute;left:8px;right:8px;top:0;height:20px;transform-origin:top;transform:rotateX(90deg);background:var(--td)}
.tile .sideL,.tile .sideR{position:absolute;top:8px;bottom:8px;width:20px;transform-origin:left;transform:rotateY(-90deg);background:var(--td);filter:brightness(.85)}
.tile .sideL{left:0}.tile .sideR{left:100%}
.tile .top{position:absolute;inset:0;border-radius:20px;transform:translateZ(20px);display:grid;place-items:center;
  background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),radial-gradient(circle at 70% 88%,rgba(0,0,0,.12),transparent 55%),var(--tc);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.9),inset 0 0 0 8px rgba(0,0,0,.05)}
.tile .ic{font-size:40px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.disc{position:absolute;border-radius:50%;transform-style:preserve-3d}
.disc .ly{position:absolute;inset:0;border-radius:50%;background:var(--td)}
.disc .top{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.65),rgba(255,255,255,0) 45%),var(--tc);box-shadow:inset 0 0 0 7px rgba(255,255,255,.95),inset 0 0 0 13px rgba(0,0,0,.06)}
.disc .ic{font-size:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.disc .gnd{position:absolute;inset:-6px -6px -14px;border-radius:50%;background:rgba(10,20,40,.32);filter:blur(7px);transform:translateZ(1px)}
.hot .top{animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:inset 0 0 0 5px #fff,0 0 0 7px rgba(255,255,255,.95),0 0 36px 12px rgba(255,255,255,.85)}}
.hubtop{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 8px #fff}
.hubtop svg{width:100%;height:100%}

/* elementos de pie: miran siempre a cámara */
.bb{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bb .fig{position:absolute;bottom:0;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--tilt) * -1))}
.bb .shd{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(10,20,40,.4),transparent 70%);transform:translateZ(1px)}
.deco .fig svg{display:block;overflow:visible}

/* ================= MUÑECOS ================= */
.char .fig{left:-44px;width:88px;height:114px}
.char .shd{width:78px;height:40px;left:-39px;top:-20px}
.char .ring{position:absolute;width:110px;height:110px;left:-55px;top:-55px;border-radius:50%;border:7px solid var(--pc);transform:translateZ(1px);opacity:0}
.char.act .ring{opacity:1;animation:ring 1.3s ease-in-out infinite}
@keyframes ring{0%{transform:translateZ(1px) scale(.65);opacity:1}100%{transform:translateZ(1px) scale(1.3);opacity:0}}
.char .tagn{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);white-space:nowrap;background:var(--pc);color:#fff;font-family:var(--disp);font-size:22px;padding:2px 12px 3px;border-radius:99px;box-shadow:0 3px 0 var(--pd);opacity:0;transition:opacity .3s}
.char.act .tagn{opacity:1;animation:tagb 1s ease-in-out infinite}
@keyframes tagb{50%{transform:translateX(-50%) translateY(-6px)}}
.ch{width:100%;height:100%;transition:transform .2s}
.ch.flip{transform:scaleX(-1)}
.ch svg{width:100%;height:100%;overflow:visible}
.ch svg g{transform-box:fill-box}
.ch .lg,.ch .am{transform-origin:50% 8%}
.ch .bod{transform-origin:50% 100%;animation:bob 2.2s ease-in-out infinite}
.ch .eyes{transform-origin:50% 50%;animation:blink 4.6s infinite}
.ch .mo{display:none}.ch .mo.happy{display:inline}
@keyframes bob{50%{transform:translateY(-2.5px) scale(1.01,.99)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.char.act .ch .am.r{animation:wave .9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-110deg)}}
.ch.walk .lg.l{animation:legA .34s ease-in-out infinite alternate}
.ch.walk .lg.r{animation:legA .34s ease-in-out infinite alternate-reverse}
.ch.walk .am.l{animation:armA .34s ease-in-out infinite alternate-reverse!important}
.ch.walk .am.r{animation:armA .34s ease-in-out infinite alternate!important}
.ch.walk .bod{animation:wbob .17s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes armA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes wbob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.ch.yay .bod{animation:none}
.ch.yay svg{animation:jump .55s cubic-bezier(.3,1.5,.5,1) infinite;transform-origin:50% 100%}
.ch.yay .am.l{animation:yayL .28s ease-in-out infinite alternate!important}
.ch.yay .am.r{animation:yayR .28s ease-in-out infinite alternate!important}
.ch.yay .lg.l{animation:legA .28s infinite alternate}.ch.yay .lg.r{animation:legA .28s infinite alternate-reverse}
.ch.yay .mo.happy,.ch.sad .mo.happy{display:none}.ch.yay .mo.yay{display:inline}.ch.sad .mo.sad{display:inline}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94)}50%{transform:translateY(-22px) scale(.96,1.05)}}
@keyframes yayL{from{transform:rotate(130deg)}to{transform:rotate(165deg)}}
@keyframes yayR{from{transform:rotate(-130deg)}to{transform:rotate(-165deg)}}
.ch.sad .bod{animation:sadb 1.6s ease-in-out infinite;transform-origin:50% 100%}
.ch.sad .am.l{transform:rotate(12deg)}.ch.sad .am.r{transform:rotate(-12deg)}
.ch.sad .eyes{transform:scaleY(.55);animation:none}
@keyframes sadb{0%,100%{transform:rotate(-4deg) translateY(3px)}50%{transform:rotate(4deg) translateY(3px)}}

/* ================= MARCO DEL EQUIPO ================= */
#frame{position:fixed;inset:0;z-index:9;pointer-events:none;box-shadow:inset 0 0 0 .7rem var(--team),inset 0 0 3.5rem 1rem color-mix(in srgb,var(--team) 55%,transparent);opacity:0;transition:opacity .5s,box-shadow .5s}
body.ingame #frame{opacity:1}
#who{position:fixed;z-index:11;left:1.6rem;bottom:1.6rem;display:flex;align-items:center;gap:1rem;padding:.6rem 1.6rem .6rem .6rem;border-radius:2rem;background:var(--team);box-shadow:0 .45rem 0 var(--teamd),0 1.2rem 2.4rem rgba(20,10,60,.35);color:#fff;transform:translateY(12rem);transition:transform .5s cubic-bezier(.3,1.5,.5,1),background .4s}
body.ingame #who{transform:none}
#who .pic{width:6.6rem;height:7.6rem;border-radius:1.4rem;background:rgba(255,255,255,.95);display:grid;place-items:end center;overflow:hidden;padding-top:.4rem}
#who .pic .ch{width:5.6rem;height:7.2rem}
#who .a{font-weight:900;font-size:1.2rem;opacity:.95}
#who .b{font-family:var(--disp);font-size:3.2rem;line-height:1;text-shadow:0 .2rem 0 rgba(0,0,0,.18)}
#who .c{margin-top:.3rem}

/* ================= HUD ================= */
.ui{position:fixed;z-index:10}
#hud{top:1.4rem;left:1.6rem;right:6rem;display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;pointer-events:none;transition:opacity .4s,transform .4s}
#hud.off{opacity:0;transform:translateY(-3rem)}
.tc{display:flex;align-items:center;gap:.7rem;padding:.45rem 1.1rem .45rem .45rem;border-radius:99rem;background:rgba(255,255,255,.9);box-shadow:0 .35rem 0 rgba(36,22,79,.12);transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,opacity .3s;opacity:.8}
.tc .hd{width:3rem;height:3rem;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:1.7rem}
.tc .nm{font-weight:900;font-size:1.2rem;max-width:9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .q{width:2.9rem;height:2.9rem;flex:none}
.tc .cnt{font-family:var(--disp);font-size:1.4rem;color:var(--violet)}
.tc.active{opacity:1;transform:scale(1.14) translateY(.3rem);background:#fff;box-shadow:0 0 0 .32rem var(--pc),0 .8rem 1.8rem rgba(36,22,79,.3)}
#gear{top:1.4rem;right:1.6rem;width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:1.4rem;cursor:pointer;box-shadow:0 .35rem 0 rgba(36,22,79,.12)}
#hint{left:50%;bottom:1.6rem;transform:translateX(-50%);display:flex;align-items:center;gap:1.4rem;padding:.7rem 1.6rem .7rem .8rem;border-radius:99rem;background:rgba(255,255,255,.95);box-shadow:0 .4rem 0 rgba(36,22,79,.14),0 1rem 2rem rgba(36,22,79,.18);font-weight:800;font-size:1.25rem;transition:opacity .3s;pointer-events:none;overflow:hidden;white-space:nowrap}
#hint.off{opacity:0}
#hint .k{display:flex;align-items:center;gap:.6rem}
#hint .btn{width:2.4rem;height:2.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8283c 60%,#b3122a);box-shadow:0 .25rem 0 #7d0b1d;transition:transform .1s}
#hint .k.hold .btn{box-shadow:0 .25rem 0 #7d0b1d,0 0 0 .3rem #fff,0 0 0 .5rem #e8283c}
#hint .k b{font-weight:600;color:#7a6aa8;margin-right:.3rem}
#hint .sep{width:2px;height:1.8rem;background:#e6e1f5}
#holdbar{position:absolute;left:0;bottom:0;height:.35rem;width:0;background:#e8283c}
body.charging #holdbar{width:100%;transition:width .65s linear}
body.pressing #hint .btn{transform:translateY(.2rem);box-shadow:0 .05rem 0 #7d0b1d}

/* ================= CAPAS ================= */
.layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .35s,visibility .35s;pointer-events:none}
.layer.show{visibility:visible;opacity:1;pointer-events:auto}
#intro{z-index:15;align-content:start;padding-top:4vh}
.logo{font-family:var(--disp);font-size:min(10.5rem,15vw);line-height:.9;color:#fff;transform:rotate(-4deg);text-shadow:0 .05em 0 #7b5cf0,0 .1em 0 #5b3fd6,0 .15em 0 #4329a8,0 .26em .3em rgba(36,22,79,.35)}
body[data-theme=xmas] .logo{text-shadow:0 .05em 0 #e8283c,0 .1em 0 #b5122b,0 .15em 0 #7d0b1d,0 .26em .3em rgba(0,0,0,.4)}
body[data-theme=uni] .logo{text-shadow:0 .03em 0 #ff7ac8,0 .06em 0 #ffb85c,0 .09em 0 #ffe066,0 .12em 0 #72e3a0,0 .15em 0 #6cb8ff,0 .18em 0 #a98bff,0 .3em .3em rgba(120,60,160,.3)}
.tag{margin-top:2.4rem;justify-self:center;background:#fff;color:var(--violet);font-weight:900;font-size:1.7rem;padding:.6rem 1.8rem;border-radius:99rem;box-shadow:0 .4rem 0 #c9b8ff;transform:rotate(2deg)}
#intro.show .logo{animation:drop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-60vh) rotate(-20deg)}100%{transform:rotate(-4deg)}}

#setup{z-index:15}
.panel{width:min(64rem,94vw);background:rgba(255,255,255,.95);border-radius:2.4rem;padding:1.7rem 2.2rem 1.9rem;box-shadow:0 .7rem 0 rgba(36,22,79,.12),0 2rem 4rem rgba(36,22,79,.25);display:flex;flex-direction:column;gap:.55rem}
.panel h2{font-family:var(--disp);font-weight:400;font-size:2.8rem;color:var(--violet);line-height:1}
.panel .sub{font-weight:600;color:#7a6aa8;font-size:1.1rem;margin-bottom:.2rem}
.srow{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;border-radius:1.3rem;border:.22rem solid transparent;transition:border-color .2s,background .2s}
.srow.cur{border-color:var(--violet);background:#f4f0ff}
.srow .lbl{width:11rem;font-weight:900;font-size:1.3rem;flex:none}
.chips{display:flex;gap:.55rem;flex-wrap:wrap}
.chip{border:0;border-radius:99rem;padding:.5rem 1.15rem;background:#efeaff;color:var(--ink);font-family:var(--ui);font-weight:800;font-size:1.2rem;cursor:pointer}
.chip.on{background:var(--violet);color:#fff;box-shadow:0 .25rem 0 #3a26a0}
.teamlist{display:flex;gap:.6rem;flex-wrap:wrap}
.tchip{display:flex;align-items:center;gap:.45rem;background:#fff;border-radius:99rem;padding:.25rem .8rem .25rem .25rem;box-shadow:inset 0 0 0 .18rem #efeaff}
.tchip .hd{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:1.2rem}
.tchip input{border:0;background:transparent;font-weight:800;font-size:1.05rem;width:7.5rem;outline:none}
.note{font-size:1rem;font-weight:700;color:#7a6aa8;margin-left:.4rem}
.go{justify-content:center;margin-top:.3rem}
.go .play{font-family:var(--disp);font-size:2.3rem;color:#fff;background:linear-gradient(180deg,#ff6b7d,#e8283c);border:0;border-radius:99rem;padding:.6rem 3.4rem;box-shadow:0 .45rem 0 #9e1428;cursor:pointer}
.srow.go.cur{background:transparent;border-color:transparent}
.srow.go.cur .play{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* dado */
#dice{z-index:25;pointer-events:none}
.dwrap{perspective:1200px;display:grid;place-items:center}
.dbounce{transform-style:preserve-3d}
.cube{position:relative;width:11rem;height:11rem;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.15,.8,.25,1)}
.cube .f{position:absolute;inset:0;border-radius:2rem;background:radial-gradient(circle at 30% 25%,#fff,#f3efff 70%,#e2dbff);box-shadow:inset 0 0 0 .3rem #fff,inset 0 -.6rem 1rem rgba(91,63,214,.18);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.5rem;backface-visibility:hidden}
.cube .f span{border-radius:50%;margin:.35rem}
.cube .f span.p{background:radial-gradient(circle at 35% 30%,#6f55e8,#2c1a7a)}
body[data-theme=xmas] .cube .f span.p{background:radial-gradient(circle at 35% 30%,#ff6b6b,#a80d22)}
body[data-theme=uni] .cube .f span.p{background:radial-gradient(circle at 35% 30%,#ff9ad5,#b04bd8)}
.f1{transform:translateZ(5.5rem)}.f6{transform:rotateY(180deg) translateZ(5.5rem)}.f3{transform:rotateY(90deg) translateZ(5.5rem)}.f4{transform:rotateY(-90deg) translateZ(5.5rem)}.f5{transform:rotateX(90deg) translateZ(5.5rem)}.f2{transform:rotateX(-90deg) translateZ(5.5rem)}
.dsh{width:12rem;height:2.4rem;border-radius:50%;background:radial-gradient(ellipse,rgba(36,22,79,.35),transparent 70%);margin-top:2.2rem}
.dnum{position:absolute;font-family:var(--disp);font-size:9rem;color:#fff;text-shadow:0 .4rem 0 var(--teamd),0 1rem 2rem rgba(36,22,79,.4);opacity:0}
#dice.done .dnum{animation:numPop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes numPop{0%{opacity:0;transform:translate(9rem,-6rem) scale(.3)}100%{opacity:1;transform:translate(9rem,-6rem) scale(1)}}

/* pregunta */
#qlay{z-index:22;background:radial-gradient(ellipse at center,rgba(20,10,60,.15),rgba(20,10,60,.6))}
.qcard{position:relative;width:min(78rem,90vw);margin-left:9rem;background:#fff;border-radius:2.6rem;overflow:hidden;box-shadow:0 0 0 .6rem var(--team),0 .9rem 0 .6rem var(--teamd),0 3rem 6rem rgba(20,10,60,.5)}
#qlay.show .qcard{animation:cardIn .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardIn{0%{transform:perspective(1400px) rotateX(70deg) translateY(30vh) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.qteam{display:flex;align-items:center;gap:.8rem;padding:.7rem 2.2rem;background:var(--team);color:#fff;font-weight:900;font-size:1.5rem}
.qteam .hd{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem}
.qteam b{font-family:var(--disp);font-weight:400;font-size:2.1rem;line-height:1}
.qteam .fin{margin-left:auto;background:#fff;color:var(--ink);border-radius:99rem;padding:.2rem 1rem;font-size:1.15rem}
.qhead{display:flex;align-items:center;gap:1rem;padding:1rem 2.2rem;background:radial-gradient(circle at 15% 0,rgba(255,255,255,.35),transparent 50%),var(--cc);color:#fff}
.qhead .ci{width:3.8rem;height:3.8rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.2rem;box-shadow:0 .25rem 0 rgba(0,0,0,.15)}
.qhead .cn{font-family:var(--disp);font-size:2.3rem;text-shadow:0 .2rem 0 rgba(0,0,0,.15)}
.qhead .lv{display:flex;gap:.3rem;margin-left:.4rem}
.qhead .lv i{width:.85rem;height:.85rem;border-radius:50%;background:rgba(255,255,255,.4)}
.qhead .lv i.on{background:#fff}
.qbody{padding:1.8rem 2.4rem 2.1rem}
#qText{font-weight:900;font-size:2.9rem;line-height:1.14;letter-spacing:-.01em;margin-bottom:1.6rem;max-width:58ch}
#qText.long{font-size:2.35rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.opt{position:relative;display:flex;align-items:center;gap:1rem;padding:.95rem 1.3rem;border-radius:1.5rem;background:#f4f1ff;font-weight:800;font-size:1.9rem;line-height:1.15;border:.32rem solid transparent;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s,opacity .3s}
.opt .l{position:relative;z-index:1;flex:none;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:1.6rem;box-shadow:inset 0 -.2rem 0 rgba(0,0,0,.18)}
.opt .t{position:relative;z-index:1}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teaml)}
.opt.sel{border-color:var(--team);background:#fff;transform:scale(1.035);box-shadow:0 .5rem 1.2rem rgba(36,22,79,.15)}
.opt.sel::after{content:"";position:absolute;right:1.2rem;top:50%;width:1.4rem;height:1.4rem;margin-top:-.7rem;border-radius:50%;background:var(--team);animation:blinkdot .9s ease-in-out infinite}
@keyframes blinkdot{50%{transform:scale(.5);opacity:.4}}
body.charging .opt.sel::before{width:100%;transition:width .65s linear}
.opt.right{background:#2fcb6e;color:#fff;border-color:#1fa857;transform:scale(1.05)}
.opt.right .l{background:#fff;color:#1fa857}
.opt.wrong{background:#ff5a5f;color:#fff;border-color:#d63a40;animation:shake .45s}
.opt.trick{background:linear-gradient(100deg,#ffd1ec,#e2d1ff,#cdeeff,#d8ffe6);border-color:#fff}
.opt.right::after,.opt.wrong::after,.opt.trick::after{display:none}
.opt.fade{opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-.8rem)}40%,80%{transform:translateX(.8rem)}}
.verdict{position:absolute;right:2.6rem;top:4.2rem;font-family:var(--disp);font-size:5.2rem;color:var(--vc,#2fcb6e);transform:rotate(-8deg);opacity:0;pointer-events:none;-webkit-text-stroke:.12em #fff;paint-order:stroke fill;filter:drop-shadow(0 .3rem .4rem rgba(36,22,79,.3))}
.verdict.on{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.qmsg{margin-top:1.2rem;min-height:2.2rem;font-weight:800;font-size:1.45rem;color:#7a6aa8;text-align:center}
.qmsg b{color:var(--ink)}

/* elegir categoría */
#pick{z-index:22;background:radial-gradient(ellipse at center,rgba(20,10,60,.15),rgba(20,10,60,.6))}
.pickbox{display:flex;flex-direction:column;align-items:center;gap:2rem}
.pickbox h3{font-family:var(--disp);font-weight:400;font-size:3.6rem;color:#fff;text-shadow:0 .3rem 0 var(--teamd)}
.pcats{display:flex;gap:1.3rem;flex-wrap:wrap;justify-content:center}
.pcat{width:10.5rem;height:11.5rem;border-radius:2rem;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.6),transparent 45%),var(--cc);box-shadow:inset 0 0 0 .35rem rgba(255,255,255,.9),0 .5rem 0 rgba(36,22,79,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:#fff;font-family:var(--disp);font-size:1.4rem;text-align:center;line-height:1.05;padding:.6rem;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pcat .e{font-size:3.8rem}
.pcat.sel{transform:translateY(-1rem) scale(1.1);box-shadow:inset 0 0 0 .35rem #fff,0 0 0 .45rem var(--team),0 1.2rem 2rem rgba(36,22,79,.35)}

#pop{z-index:24;pointer-events:none;align-content:start;padding-top:17vh}
.popt{font-family:var(--disp);font-size:6.6rem;color:#fff;text-align:center;line-height:1;text-shadow:0 .08em 0 var(--teamd),0 .16em 0 rgba(0,0,0,.25),0 .3em .4em rgba(20,10,60,.35);transform:rotate(-4deg)}
.popt small{display:block;font-family:var(--ui);font-weight:900;font-size:1.8rem;text-shadow:0 .15rem 0 rgba(0,0,0,.3);margin-top:1rem}
#pop.show .popt{animation:stamp2 .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp2{0%{transform:rotate(-4deg) scale(2.6);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}
.flyq{position:fixed;z-index:40;width:4rem;height:4rem;margin:-2rem 0 0 -2rem;pointer-events:none}

#win{z-index:30;overflow:hidden}
#win .rays{position:absolute;left:50%;top:45%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(from 0deg,var(--pc) 0 8deg,var(--pl) 8deg 16deg);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:1rem}
.wchar{width:16rem;height:21rem}
.wt{font-family:var(--disp);font-size:6rem;color:#fff;line-height:1;text-shadow:0 .08em 0 rgba(0,0,0,.2),0 .25em .4em rgba(0,0,0,.2);text-align:center}
.rank{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.rank .tc{opacity:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cloud,#win .rays,.aurora{animation:none!important}}
.famline{margin-top:.4rem;font-weight:700;font-size:1.05rem;color:#7a6aa8;text-align:center;line-height:1.35}

.qhead .qtag{margin-left:.6rem;background:rgba(255,255,255,.25);border-radius:99rem;padding:.25rem .9rem;font-weight:900;font-size:1.05rem}
.qhead.rainbow{background:linear-gradient(90deg,#ff8fcb,#ffb85c,#ffe066,#72e3a0,#6cb8ff,#a98bff)}
.opts.two .opt{justify-content:center;font-size:2.3rem;padding:1.4rem}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d=.15,type='sine',v=.2,t0=0,f2){const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d=.05,v=.2,t0=0,freq=2000){const a=ac();if(!a)return;const t=a.currentTime+t0;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t)}

const CF=(()=>{const cv=$('#confetti'),cx=cv.getContext('2d');let Wd,Hd,d=1,P=[],run=false,until=0;
  function rs(){d=Math.min(devicePixelRatio||1,2);Wd=cv.width=innerWidth*d;Hd=cv.height=innerHeight*d}rs();addEventListener('resize',rs);
  function pal(){return S.mode==='uni'?['#ff8fcb','#ffd25e','#6ee0a2','#76c7ff','#b596ff','#fff']:S.mode==='xmas'?['#d7262e','#1fa45c','#f2b705','#fff','#e8436f']:['#FF7A2F','#3D8BFF','#FFC21A','#4CC94A','#9B6BFF','#FF6FB1','#fff']}
  function add(x,y,vx,vy,cols){P.push({x,y,vx,vy,r:(Math.random()*8+7)*d,a:Math.random()*6.3,va:(Math.random()-.5)*.3,c:rnd(cols||pal()),sh:Math.random()<.6,w:Math.random()*.05,l:1})}
  function burst(x,y,n=130,cols){x*=d;y*=d;for(let i=0;i<n;i++){const an=Math.random()*6.3,sp=(Math.random()*15+6)*d;add(x,y,Math.cos(an)*sp,Math.sin(an)*sp-7*d,cols)}go()}
  function rain(ms){until=performance.now()+ms;go()}
  function go(){if(!run){run=true;requestAnimationFrame(loop)}}
  function loop(t){if(t<until)for(let i=0;i<5;i++)add(Math.random()*Wd,-20,(Math.random()-.5)*4*d,Math.random()*4*d+2*d);
    cx.clearRect(0,0,Wd,Hd);for(const p of P){p.vy+=.36*d;p.vx*=.985;p.vy*=.985;p.x+=p.vx+Math.sin(p.a*2)*p.w*20;p.y+=p.vy;p.a+=p.va;if(p.y>Hd+30)p.l=0;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;if(p.sh)cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2*Math.abs(Math.cos(p.a*3))+2);else{cx.beginPath();cx.arc(0,0,p.r/2.4,0,6.3);cx.fill()}cx.restore()}
    P=P.filter(p=>p.l);if(P.length||t<until)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,Wd,Hd)}}
  return{burst,rain}})();
const FX=(()=>{const cv=$('#fx'),cx=cv.getContext('2d');let Wd,Hd,d=1,P=[],mode=null,raf=0,last=0;
  function rs(){d=Math.min(devicePixelRatio||1,1.5);Wd=cv.width=innerWidth*d;Hd=cv.height=innerHeight*d}rs();addEventListener('resize',rs);
  function set(m){mode=m;P=[];cx.clearRect(0,0,Wd,Hd);if(m&&!raf)raf=requestAnimationFrame(loop)}
  function loop(t){raf=0;if(!mode){cx.clearRect(0,0,Wd,Hd);return}raf=requestAnimationFrame(loop);if(t-last<33)return;last=t;
    const max=mode==='snow'?140:60;while(P.length<max)P.push({x:Math.random()*Wd,y:mode==='snow'?Math.random()*-Hd:Math.random()*Hd,r:(Math.random()*2.6+1)*d,s:(Math.random()*1.2+.5)*d,p:Math.random()*6.3,c:rnd(['#fff','#ffd6f2','#d8c8ff','#c8f4ff','#fff3b0'])});
    cx.clearRect(0,0,Wd,Hd);
    for(const q of P){q.p+=.05;
      if(mode==='snow'){q.y+=q.s*1.6;q.x+=Math.sin(q.p)*.6*d;if(q.y>Hd+10){q.y=-10;q.x=Math.random()*Wd}cx.globalAlpha=.85;cx.fillStyle='#fff';cx.beginPath();cx.arc(q.x,q.y,q.r,0,6.3);cx.fill()}
      else{q.y-=q.s*.5;if(q.y<-10){q.y=Hd+10;q.x=Math.random()*Wd}const a=.5+.5*Math.sin(q.p*2),s=q.r*2.4*(.6+a*.6);cx.globalAlpha=a;cx.fillStyle=q.c;cx.beginPath();cx.moveTo(q.x,q.y-s);cx.quadraticCurveTo(q.x,q.y,q.x+s,q.y);cx.quadraticCurveTo(q.x,q.y,q.x,q.y+s);cx.quadraticCurveTo(q.x,q.y,q.x-s,q.y);cx.quadraticCurveTo(q.x,q.y,q.x,q.y-s);cx.fill()}}
    cx.globalAlpha=1}
  return{set}})();

const board=$('#board');board.style.width=BW+'px';board.style.height=BW+'px';board.style.margin=`${-BW/2}px 0 0 ${-BW/2}px`;
const pol=(deg,r)=>[C+Math.cos(deg*Math.PI/180)*r,C+Math.sin(deg*Math.PI/180)*r];
const ringDeg=i=>90+i*(360/RING), spokeDeg=s=>90+s*60;
let RTILES=[];
const STILES=Array.from({length:6},(_,s)=>[0,1,2,3].map(j=>j===1?{type:'again'}:({type:'cat',cat:(s+j*2+3)%6})));
function makeRing(){RTILES=Array.from({length:RING},(_,i)=>{const s=Math.floor(i/6),o=i%6;if(o===0)return{type:'hq',cat:s};
  if(o===3){if(s%2===0)return famOK()?{type:'fam'}:{type:'again'};return S.mode==='uni'?{type:'magic'}:{type:'reto'}}
  const m={1:1,2:2,4:4,5:5}[o];return{type:'cat',cat:(s+m)%6}})}
function locXY(L){if(L.k==='hub')return[C,C];if(L.k==='spoke')return pol(spokeDeg(L.s),SP[L.j]);return pol(ringDeg(L.i),R)}
function locZ(L){return L.k==='hub'?HUBZ:(L.k==='ring'&&L.i%6===0)?HQZ:TZ}
function locKey(L){return L.k==='hub'?'h':L.k==='spoke'?`s${L.s}_${L.j}`:`r${L.i}`}
function tileOf(L){return L.k==='ring'?RTILES[L.i]:L.k==='spoke'?STILES[L.s][L.j]:{type:'hub'}}
function specialLook(t){
  if(t.type==='again')return S.mode==='xmas'?['#ffffff','#c9d6ee','🎲']:['#FFD43B','#d9a800','🎲'];
  if(t.type==='fam')return['#fff0f6','#f2a7c3','💛'];
  if(t.type==='reto')return S.mode==='xmas'?['#ffffff','#c9d6ee','🎤']:['#19C2B0','#0e8c7f','🎭'];
  if(t.type==='magic')return['conic-gradient(from 0deg,#ff8fcb,#ffd25e,#6ee0a2,#76c7ff,#b596ff,#ff8fcb)','#a98bff','🦄'];
}
function buildBoard(){
  const th=THEMES[S.mode];const body=document.body;body.dataset.theme=S.mode;makeRing();
  Object.entries(th.vars).forEach(([k,v])=>body.style.setProperty(k,v));
  S.cats=BASECATS.map((c,i)=>({...c,color:th.colors[i],dark:dark(th.colors[i],.22)}));
  let h=`<div class="dshadow" style="left:${C-RD*.9}px;top:${C-RD*.9}px;width:${RD*1.8}px;height:${RD*1.8}px;transform:translateZ(-380px)"></div>`;
  const NS=64,sw=2*Math.PI*RD/NS+2,RH=S.mode==='classic'?120:70;
  h+=`<div class="rim" style="left:${C}px;top:${C}px">`;
  for(let i=0;i<NS;i++){const a=i*360/NS;let st='';if(S.mode==='uni'){const hue=(i*360/NS*2)%360;st=`;--rimB:hsl(${hue} 95% 82%);--rimC:hsl(${(hue+40)%360} 80% 70%)`}
    h+=`<div class="sl" style="left:${-sw/2}px;width:${sw}px;height:${RH}px;transform:rotateZ(${a}deg) translateY(${RD}px) rotateX(-90deg)${st}"></div>`}
  h+=`</div><div class="disk" style="left:${C-RD}px;top:${C-RD}px;width:${2*RD}px;height:${2*RD}px"></div>`;
  h+=`<div class="track" style="left:${C-R-66}px;top:${C-R-66}px;width:${2*(R+66)}px;height:${2*(R+66)}px;background:radial-gradient(circle,transparent 0 ${R-62}px,var(--track) ${R-60}px ${R+60}px,transparent ${R+62}px)"></div>`;
  for(let s=0;s<6;s++)h+=`<div class="spokeband" style="left:${C-40}px;top:${C}px;width:80px;height:${R-40}px;background:var(--track);transform:translateZ(1px) rotateZ(${spokeDeg(s)-90}deg)"></div>`;
  if(S.mode==='xmas'){h+='<div class="lights">';const lc=['#ff4d4d','#ffd84d','#4dff9a','#4dc3ff','#ff7ae0'];for(let i=0;i<60;i++){const[x,y]=pol(i*6,RD-16);h+=`<i style="left:${x}px;top:${y}px;background:${lc[i%5]};box-shadow:0 0 10px ${lc[i%5]}"></i>`}h+='</div>'}
  RTILES.forEach((t,i)=>{const deg=ringDeg(i),[x,y]=pol(deg,R);
    if(t.type==='hq'){const c=S.cats[t.cat];h+=disc(x,y,HQD,HQZ,c.color,c.dark,`<span class="ic">${c.emoji}</span>`,`r${i}`);return}
    let tc,td,ic;if(t.type==='cat'){const c=S.cats[t.cat];tc=c.color;td=c.dark;ic=c.emoji}else[tc,td,ic]=specialLook(t);
    h+=rtile(x,y,TW,TL,deg-90,tc,td,ic,`r${i}`)});
  STILES.forEach((arr,s)=>arr.forEach((t,j)=>{const deg=spokeDeg(s),[x,y]=pol(deg,SP[j]);let tc,td,ic;if(t.type==='cat'){const c=S.cats[t.cat];tc=c.color;td=c.dark;ic=c.emoji}else[tc,td,ic]=specialLook(t);h+=rtile(x,y,ST,ST,deg-90,tc,td,ic,`s${s}_${j}`)}));
  h+=hub();
  const main=S.mode==='xmas'?['pine','gift','pine','pine','gift','pine']:S.mode==='uni'?['lolli','cupcake','lolli','lolli','cupcake','lolli']:['tree','tree','flowers','tree','tree','flowers'];
  for(let s=0;s<6;s++){const base=spokeDeg(s)+30;
    [[base,300],[base-11,226],[base+12,370]].forEach(([dg,r],j)=>{const kind=j===0?main[s]:(S.mode==='xmas'?(j===1?'gift':'pine'):S.mode==='uni'?(j===1?'cupcake':'lolli'):(j===1?'flowers':'tree'));
      const sc=j===0?1:.72;const[x,y]=pol(dg,r);const D=decoSVG(kind,s*3+j);
      h+=`<div class="bb deco" style="transform:translate3d(${x}px,${y}px,0)"><div class="shd" style="width:${D.w}px;height:${D.w*.45}px;left:${-D.w/2}px;top:${-D.w*.22}px;transform:translateZ(1px) scale(${sc})"></div><div class="fig" style="left:${-D.w/2}px;width:${D.w}px;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--tilt) * -1)) scale(${sc})">${D.svg}</div></div>`})}
  h+=`<div id="chars" class="p3" style="position:absolute;inset:0"></div>`;
  $('#spin').innerHTML=h;
  FX.set(th.fx);$('#introTag').textContent=th.tag;
}
function rtile(x,y,w,l,rot,tc,td,ic,id){return`<div class="tile" id="${id}" style="left:${x-w/2}px;top:${y-l/2}px;width:${w}px;height:${l}px;transform:rotateZ(${rot}deg);--tc:${tc};--td:${td}"><div class="gnd"></div><div class="side"></div><div class="sideT"></div><div class="sideL"></div><div class="sideR"></div><div class="top"><span class="ic" style="transform:rotateZ(${-rot}deg)">${ic}</span></div></div>`}
function disc(x,y,dia,z,tc,td,inner,id){let ly='';for(let k=0;k<z;k+=4)ly+=`<div class="ly" style="transform:translateZ(${k}px)"></div>`;return`<div class="disc" id="${id}" style="left:${x-dia/2}px;top:${y-dia/2}px;width:${dia}px;height:${dia}px;--tc:${tc};--td:${td}"><div class="gnd"></div>${ly}<div class="top" style="transform:translateZ(${z}px)">${inner}</div></div>`}
function hub(){const d=HUBR*2;let ly='';for(let k=0;k<HUBZ;k+=4)ly+=`<div class="ly" style="transform:translateZ(${k}px)"></div>`;
  let paths='';for(let s=0;s<6;s++){const a0=(spokeDeg(s)-30)*Math.PI/180,a1=(spokeDeg(s)+30)*Math.PI/180;paths+=`<path d="M50 50 L${50+50*Math.cos(a0)} ${50+50*Math.sin(a0)} A50 50 0 0 1 ${50+50*Math.cos(a1)} ${50+50*Math.sin(a1)} Z" fill="${S.cats[s].color}" stroke="#fff" stroke-width="1.6"/>`}
  const center=S.mode==='xmas'?'🎁':S.mode==='uni'?'🦄':'⭐';
  return`<div class="disc" id="hub" style="left:${C-HUBR}px;top:${C-HUBR}px;width:${d}px;height:${d}px;--td:#d8d0f0"><div class="gnd"></div>${ly}<div class="hubtop" style="transform:translateZ(${HUBZ}px)"><svg viewBox="0 0 100 100">${paths}<circle cx="50" cy="50" r="20" fill="#fff"/><text x="50" y="51" text-anchor="middle" dominant-baseline="central" font-size="20">${center}</text></svg></div></div>`}

/* ================= CÁMARA ================= */
function cam(x,y,s,oy,fast){board.classList.toggle('fast',!!fast);board.style.transform=`translateY(${oy}px) rotateX(var(--tilt)) scale(${s}) translate(${C-x}px,${C-y}px)`}
function camOverview(){cam(C,C,.6,40)}
function camIntro(){cam(C,C,.68,150)}
function camOn(L,fast){const[x,y]=locXY(L);cam(x,y,1.2,170,fast)}
function camAt(x,y,fast){cam(x,y,1.2,170,fast)}
function fit(){document.documentElement.style.setProperty('--fit',Math.min(innerWidth/1920,innerHeight/1080))}
addEventListener('resize',fit);fit();
let orbit=null;function startOrbit(){stopOrbit();const t0=performance.now();(function f(t){document.documentElement.style.setProperty('--rz',(((t-t0)/180)%360).toFixed(2)+'deg');orbit=requestAnimationFrame(f)})(t0)}
function stopOrbit(){if(orbit)cancelAnimationFrame(orbit);orbit=null;document.documentElement.style.setProperty('--rz','0deg')}

/* ================= PERSONAJES EN EL TABLERO ================= */
function buildChars(teams){
  const box=$('#chars');if(!box)return;box.innerHTML='';const hat=THEMES[S.mode].hat;
  teams.forEach((t,i)=>{const el=document.createElement('div');el.className='bb char';el.style.setProperty('--pc',t.color);el.style.setProperty('--pd',t.dark);
    el.innerHTML=`<div class="ring"></div><div class="shd"></div><div class="fig"><span class="tagn">${esc(t.name)}</span><div class="ch">${charSVG(t,hat,'b'+i)}</div></div>`;
    box.appendChild(el);t.el=el;t.ch=el.querySelector('.ch')});
  layoutChars(teams,false);
}
function charPos(t,teams){const act=(S.state!=='intro'&&S.state!=='setup')?teams[S.turn]:null;const key=locKey(t.loc);
  const same=teams.filter(o=>locKey(o.loc)===key&&o!==act);if(act&&locKey(act.loc)===key)same.push(act);
  const k=same.indexOf(t),n=same.length;let[x,y]=locXY(t.loc);
  if(n>1){const rad=t.loc.k==='hub'?66:22;const a=Math.PI/2+(k+1)*2*Math.PI/n+(t.loc.k==='hub'?Math.PI/n:0);x+=Math.cos(a)*rad;y+=Math.sin(a)*rad*.8}
  return[x,y,locZ(t.loc)]}
function layoutChars(teams=S.teams,anim=true){teams.forEach(t=>{const[x,y,z]=charPos(t,teams);const to=`translate3d(${x}px,${y}px,${z}px)`;const from=t.el.style.transform||to;t.el.style.transform=to;if(anim&&from!==to)t.el.animate([{transform:from},{transform:to}],{duration:300,easing:'ease-out'})})}
function nextLoc(t,L){if(L.k==='hub')return{k:'spoke',s:t.spoke,j:0};if(L.k==='spoke')return L.j<3?{k:'spoke',s:L.s,j:L.j+1}:{k:'ring',i:L.s*6};return{k:'ring',i:(L.i+1)%RING}}
async function walkTo(t,L2,dur=430){
  const[x1]=locXY(t.loc),[x2,y2]=locXY(L2);const from=t.el.style.transform;t.loc=L2;const to=`translate3d(${x2}px,${y2}px,${locZ(L2)}px)`;
  t.el.style.transform=to;t.ch.classList.toggle('flip',x2<x1-2);camAt(x2,y2,true);SFX.step();
  t.el.animate([{transform:from},{transform:to}],{duration:dur,easing:'linear'});await wait(dur)}
async function walkPath(t,locs){t.ch.classList.add('walk');for(const L of locs)await walkTo(t,L);t.ch.classList.remove('walk','flip');SFX.land();layoutChars()}
async function poofTo(t,L){t.el.animate([{opacity:1,filter:'none'},{opacity:0,filter:'brightness(3)'}],{duration:350,fill:'forwards'});SFX.magic();await wait(380);t.loc=L;layoutChars(S.teams,false);camOn(L);t.el.animate([{opacity:0,filter:'brightness(3)'},{opacity:1,filter:'none'}],{duration:450,fill:'forwards'});await wait(1100)}
function setActive(){S.teams.forEach((t,i)=>t.el.classList.toggle('act',i===S.turn))}
function mood(t,m,ms){t.ch.classList.remove('yay','sad');if(m)t.ch.classList.add(m);if(ms)setTimeout(()=>t.ch.classList.remove(m),ms)}

/* ================= HUD ================= */
function quesera(t,size=48){let p='';for(let k=0;k<6;k++){const a0=(-90+k*60)*Math.PI/180,a1=(-30+k*60)*Math.PI/180;p+=`<path d="M24 24 L${24+21*Math.cos(a0)} ${24+21*Math.sin(a0)} A21 21 0 0 1 ${24+21*Math.cos(a1)} ${24+21*Math.sin(a1)} Z" fill="${t.stars.has(k)?S.cats[k].color:'#ece7f8'}" stroke="#fff" stroke-width="2"/>`}
  return`<svg class="q" viewBox="0 0 48 48" width="${size}" height="${size}"><circle cx="24" cy="24" r="23" fill="#fff"/>${p}<circle cx="24" cy="24" r="23" fill="none" stroke="#d9d1f2" stroke-width="1.5"/></svg>`}
function renderHUD(){
  $('#hud').innerHTML=S.teams.map((t,i)=>`<div class="tc ${i===S.turn&&S.state!=='win'?'active':''}" id="tc${i}" style="--pc:${t.color}"><div class="hd">${t.emoji}</div><span class="nm">${esc(t.name)}</span>${quesera(t)}<span class="cnt">${t.stars.size}/${S.goal}</span></div>`).join('');
  const t=S.teams[S.turn];if(!t)return;
  document.documentElement.style.setProperty('--team',t.color);document.documentElement.style.setProperty('--teamd',t.dark);document.documentElement.style.setProperty('--teaml',light(t.color,.75));
  $('#who').innerHTML=`<div class="pic"><div class="ch">${charSVG(t,THEMES[S.mode].hat,'w'+S.turn)}</div></div><div><div class="a">${S.state==='question'?'Contestan':'Le toca a'}</div><div class="b">${esc(t.name)}</div><div class="c">${quesera(t,40)}</div></div>`;
}
function hint(tap,hold){$('#hTap').textContent=tap||'';const hk=$('#hHoldK'),sp=$('#hSep');hk.style.display=hold?'':'none';sp.style.display=hold?'':'none';$('#hHold').textContent=hold||'';$('#hint').classList.toggle('off',!tap&&!hold)}
function layer(id,on){$('#'+id).classList.toggle('show',on)}

/* ================= PULSADOR ÚNICO ================= */
let down=false,holdFired=false,holdT=null;
function canHold(){return['setup','question','pick','win','turn'].includes(S.state)}
function press(){if(down)return;down=true;holdFired=false;ac();document.body.classList.add('pressing');
  if(canHold()&&!S.busy){document.body.classList.add('charging');holdT=setTimeout(()=>{holdFired=true;document.body.classList.remove('charging');act('hold')},HOLD_MS)}}
function release(cancel){if(!down)return;down=false;clearTimeout(holdT);document.body.classList.remove('pressing','charging');if(!holdFired&&!cancel)act('tap')}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Enter'||e.key==='Escape')e.target.blur();return}
  if(e.key==='Escape'){goSetup();return}if(e.key==='F11')return;e.preventDefault();if(e.repeat)return;press()});
addEventListener('keyup',e=>{if(e.target.tagName==='INPUT')return;release()});
addEventListener('pointerdown',e=>{if(e.target.closest('input,[data-click],a'))return;if(e.button>0)return;press()});
addEventListener('pointerup',()=>release());addEventListener('pointercancel',()=>release(true));addEventListener('blur',()=>release(true));
addEventListener('contextmenu',e=>e.preventDefault());
function act(k){if(S.busy)return;const st=S.state;
  if(st==='intro'){SFX.tap();goSetup();return}
  if(st==='setup'){k==='tap'?setupNext():setupHold();return}
  if(st==='turn'){cur().stars.size>=S.goal?finalRun():roll();return}
  if(st==='question'){if(k==='tap')moveSel(1);else answer(S.sel);return}
  if(st==='result'){afterResult();return}
  if(st==='pick'){if(k==='tap')movePick(1);else choosePick();return}
  if(st==='win'){k==='tap'?startGame():goSetup();return}}

/* ================= FAMILIA (Supabase) ================= */
async function rpc(fn,args){const base=CFG.supabaseUrl.replace(/\/+$/,'');const headers={apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'};
  if(CFG.supabaseAnonKey.startsWith('eyJ'))headers.Authorization='Bearer '+CFG.supabaseAnonKey;
  const r=await fetch(`${base}/rest/v1/rpc/${fn}`,{method:'POST',headers,body:JSON.stringify(args)});const txt=await r.text();if(!r.ok)throw new Error(txt||r.status);return txt?JSON.parse(txt):null}
let famState='off';
async function loadFam(){if(!CFG||!CFG.supabaseUrl){famState='off';return}
  famState='loading';try{const rows=await rpc('sbt_leer',{p_familia:FAMILY});FAM=(rows||[]).filter(r=>r&&r.nombre&&r.datos);famState='ok'}catch(e){famState='error';FAM=[]}
  if(S.state==='setup'){showroom();renderSetup()}}
function famLink(){const u=new URL('familia.html',location.href);if(FAMILY!=='familia')u.searchParams.set('f',FAMILY);return u.href}
function famQuestion(){
  const people=FAM;const cands=[];
  people.forEach(p=>FAMQ.forEach(q=>{const v=p.datos[q.k];if(!v||!String(v).trim())return;const key=p.nombre+'|'+q.k;if((S.used.fam||[]).includes(key))return;
    if(q.t==='who'&&people.length<2)return;cands.push({p,q,v:String(v).trim(),key})}));
  if(!cands.length){S.used.fam=[];return null}
  const {p,q,v,key}=rnd(cands);(S.used.fam=S.used.fam||[]).push(key);
  const same=s=>String(s).trim().toLowerCase();
  if(q.t==='bin'){return{kind:'fam',q:q.ask.replace('{n}',p.nombre),opts:q.opts.slice(),correct:q.opts.findIndex(o=>same(o)===same(v)),answer:v}}
  if(q.t==='who'){const others=shuffle(people.filter(o=>o.nombre!==p.nombre).map(o=>o.nombre)).slice(0,3);const opts=shuffle([p.nombre,...others]);return{kind:'fam',q:`${q.ask} «${v}»`,opts,correct:opts.indexOf(p.nombre),answer:p.nombre}}
  const pool=[];people.forEach(o=>{if(o.nombre===p.nombre)return;const w=o.datos[q.k];if(w&&same(w)!==same(v)&&!pool.some(x=>same(x)===same(w)))pool.push(String(w).trim())});
  shuffle(q.opts).forEach(w=>{if(same(w)!==same(v)&&!pool.some(x=>same(x)===same(w)))pool.push(w)});
  const opts=shuffle([v,...shuffle(pool.slice(0,6)).slice(0,3)]);return{kind:'fam',q:q.ask.replace('{n}',p.nombre),opts,correct:opts.indexOf(v),answer:v}
}

/* ================= PORTADA Y MENÚ ================= */
function demoTeams(){return teamSet().slice(0,S.nTeams).map((t,i)=>({...t,name:nameOf(i),loc:{k:'hub'},stars:new Set()}))}
function showroom(){buildBoard();S.demo=demoTeams();buildChars(S.demo);S.demo.forEach(t=>t.el.classList.add('act'))}
function goIntro(){S.state='intro';closeAll();document.body.classList.remove('ingame');showroom();layer('intro',true);$('#hud').classList.add('off');$('#gear').style.display='none';camIntro();startOrbit();hint(' para empezar','')}
function goSetup(){closeAll();S.state='setup';S.row=5;document.body.classList.remove('ingame');showroom();layer('setup',true);$('#hud').classList.add('off');$('#gear').style.display='none';camOverview();startOrbit();renderSetup()}
function closeAll(){['intro','setup','dice','qlay','pick','pop','win'].forEach(id=>layer(id,false));$$('.hot').forEach(t=>t.classList.remove('hot'))}
const ROWS_S=['mode','teams','names','diff','goal','go'];
function renderSetup(){
  $('#cMode').innerHTML=Object.entries(THEMES).map(([k,v])=>`<button class="chip ${k===S.mode?'on':''}" data-click data-m="${k}">${v.label}</button>`).join('');
  $('#cTeams').innerHTML=[2,3,4,5,6].map(n=>`<button class="chip ${n===S.nTeams?'on':''}" data-click data-n="${n}">${n}</button>`).join('');
  $('#cDiff').innerHTML=DIFFS.map(d=>`<button class="chip ${d.v===S.diff?'on':''}" data-click data-d="${d.v}">${d.l}</button>`).join('');
  $('#diffNote').textContent=S.mode==='xmas'?'Mitad navideñas, mitad de todo':S.mode==='uni'?'Con casillas mágicas y alguna trampa':'';
  $('#cGoal').innerHTML=GOALS.map(g=>`<button class="chip ${g===S.goal?'on':''}" data-click data-g="${g}">${g}</button>`).join('');
  const ts=teamSet();
  $('#tList').innerHTML=ts.slice(0,S.nTeams).map((t,i)=>`<label class="tchip" style="--pc:${t.color}"><span class="hd">${t.emoji}</span><input data-i="${i}" value="${esc(nameOf(i))}" maxlength="20"></label>`).join('');
  $$('#cMode .chip').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $$('#cTeams .chip').forEach(b=>b.onclick=()=>{S.nTeams=+b.dataset.n;SFX.tap();save();showroom();renderSetup()});
  $$('#cDiff .chip').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;SFX.tap();save();renderSetup()});
  $$('#cGoal .chip').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;SFX.tap();save();renderSetup()});
  $$('#tList input').forEach(inp=>inp.oninput=()=>{(S.namesBy[S.mode]=S.namesBy[S.mode]||[])[+inp.dataset.i]=inp.value;save()});
  const fl=$('#famLine');
  if(famState==='ok'&&famOK())fl.innerHTML=`💛 <b>${FAM.length} familiares</b> han contestado: habrá casillas de Familia. Enlace para el resto: <span class="lnk">${esc(famLink())}</span>`;
  else if(famState==='ok')fl.innerHTML=`💛 Para las preguntas de Familia hacen falta al menos 2 respuestas (hay ${FAM.length}). Enlace: <span class="lnk">${esc(famLink())}</span>`;
  else if(famState==='loading')fl.innerHTML='💛 Buscando las respuestas de la familia…';
  else if(famState==='error')fl.innerHTML='💛 La categoría Familia aún no está activada en la base de datos (falta un paso de configuración).';
  else fl.innerHTML='💛 La categoría Familia funciona desde la versión publicada en GitHub.';
  $$('.srow').forEach(r=>r.classList.toggle('cur',r.dataset.row===ROWS_S[S.row%ROWS_S.length]));
  const r=ROWS_S[S.row%ROWS_S.length];hint(' siguiente fila',r==='go'?' empezar la partida':r==='names'?' (se escriben con teclado)':' cambiar la opción');
}
function setMode(m){S.mode=m;SFX.hold();save();showroom();renderSetup()}
function setupNext(){S.row=(S.row+1)%ROWS_S.length;SFX.tap();renderSetup()}
function setupHold(){const r=ROWS_S[S.row%ROWS_S.length];
  if(r==='mode'){const ks=Object.keys(THEMES);setMode(ks[(ks.indexOf(S.mode)+1)%ks.length]);return}
  SFX.hold();
  if(r==='teams'){S.nTeams=S.nTeams>=6?2:S.nTeams+1;save();showroom()}
  else if(r==='diff'){const i=DIFFS.findIndex(d=>d.v===S.diff);S.diff=DIFFS[(i+1)%DIFFS.length].v}
  else if(r==='goal'){const i=GOALS.indexOf(S.goal);S.goal=GOALS[(i+1)%GOALS.length]}
  else if(r==='go'){startGame();return}
  save();renderSetup()}
$('#playBtn').onclick=()=>{ac();startGame()};$('#gear').onclick=()=>goSetup();

/* ================= PARTIDA ================= */
function cur(){return S.teams[S.turn]}
function startGame(){
  closeAll();stopOrbit();save();buildBoard();
  S.teams=teamSet().slice(0,S.nTeams).map((t,i)=>({...t,name:nameOf(i).trim()||t.name,loc:{k:'hub'},spoke:i%6,stars:new Set(),right:0}));
  S.turn=0;S.used={};S.state='turn';
  buildChars(S.teams);renderHUD();$('#hud').classList.remove('off');$('#gear').style.display='';document.body.classList.add('ingame');
  SFX.hold();camOverview();S.busy=true;setTimeout(()=>{S.busy=false;beginTurn()},1000);
}
function beginTurn(again){
  const t=cur();S.state='turn';setActive();layoutChars();renderHUD();camOn(t.loc);
  const fin=t.stars.size>=S.goal;
  popMsg(fin?'¡A por la final!':again?'¡Seguís!':`¡Le toca a ${esc(t.name)}!`,fin?'Pregunta final en el centro del tablero':'');
  hint(fin?' ir al centro':' tirar el dado','');
}

/* ---- dado ---- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],5:[-90,0],2:[90,0]};
$('#cube').innerHTML=[1,2,3,4,5,6].map(n=>`<div class="f f${n}">${Array.from({length:9},(_,i)=>`<span class="${PIPS[n].includes(i)?'p':''}"></span>`).join('')}</div>`).join('');
let drot={x:-20,y:25};
async function roll(){
  S.busy=true;S.state='rolling';layer('pop',false);hint('','');
  const v=1+Math.random()*6|0;const cube=$('#cube'),dl=$('#dice');
  dl.classList.remove('done');$('#dnum').textContent=v;cube.style.transition='none';cube.style.transform=`rotateX(${drot.x}deg) rotateY(${drot.y}deg)`;
  layer('dice',true);SFX.dice();
  $('#dbounce').animate([{transform:'translateY(-70vh) scale(.6)'},{transform:'translateY(0) scale(1)',offset:.45},{transform:'translateY(-14vh) scale(1)',offset:.62},{transform:'translateY(0) scale(1)',offset:.8},{transform:'translateY(-3vh)',offset:.9},{transform:'translateY(0)'}],{duration:1400,easing:'ease-out'});
  await wait(30);const[fx,fy]=FACE[v];const bx=Math.ceil(drot.x/360)*360+720,by=Math.ceil(drot.y/360)*360+1080;
  drot={x:bx+fx-14,y:by+fy+20};cube.style.transition='';cube.style.transform=`rotateX(${drot.x}deg) rotateY(${drot.y}deg)`;
  await wait(1450);dl.classList.add('done');SFX.land();await wait(850);layer('dice',false);
  await move(v);
}
async function move(v){const t=cur();const locs=[];let L=t.loc;for(let i=0;i<v;i++){L=nextLoc(t,L);locs.push(L)}
  await walkPath(t,locs);const te=document.getElementById(locKey(t.loc));te&&te.classList.add('hot');
  await wait(500);S.busy=false;land(tileOf(t.loc))}
function land(tile){
  if(tile.type==='again'){popMsg('¡Tira otra vez!','Casilla de dado');S.busy=true;setTimeout(()=>{S.busy=false;clearHot();beginTurn(true)},1600);return}
  if(tile.type==='fam'){const q=famOK()&&famQuestion();if(q){showQ({...q,head:'fam'});return}return land({type:'again'})}
  if(tile.type==='reto')return askReto(false);
  if(tile.type==='magic')return magic();
  ask(tile.cat,false);
}
function clearHot(){$$('.hot').forEach(t=>t.classList.remove('hot'))}
function popMsg(a,b){$('#popt').innerHTML=`${a}${b?`<small>${b}</small>`:''}`;layer('pop',false);void $('#popt').offsetWidth;layer('pop',true);clearTimeout(popMsg.t);popMsg.t=setTimeout(()=>layer('pop',false),1800)}

/* ---- magia (modo unicornio) ---- */
async function magic(){
  S.busy=true;S.state='moving';hint('','');const ev=rnd(MAGIC),t=cur();SFX.magic();popMsg('✨ '+ev.t,ev.s);
  const r=innerWidth/2;CF.burst(r,innerHeight*.35,120,['#ff8fcb','#ffd25e','#6ee0a2','#76c7ff','#b596ff','#fff']);
  await wait(2000);clearHot();
  if(ev.k==='galope'){await move(3);return}
  if(ev.k==='tele'){let i;do{i=Math.random()*RING|0}while(t.loc.k==='ring'&&t.loc.i===i);await poofTo(t,{k:'ring',i});const te=document.getElementById('r'+i);te&&te.classList.add('hot');S.busy=false;land(RTILES[i]);return}
  if(ev.k==='swap'){const others=S.teams.filter(o=>o!==t);if(!others.length){S.busy=false;beginTurn(true);return}const o=rnd(others);const a=t.loc,b=o.loc;
    t.el.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});o.el.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});await wait(320);
    t.loc=b;o.loc=a;layoutChars(S.teams,false);t.el.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'});o.el.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'});
    camOn(t.loc);popMsg('¡Cambiados!',`Ahora estáis donde estaba ${esc(o.name)}`);await wait(1900);S.busy=false;beginTurn(true);return}
  if(ev.k==='wish'){S.busy=false;openPick('Deseo concedido');return}
  if(ev.k==='reto'){S.busy=false;askReto(true);return}
  CF.rain(1500);await wait(1200);S.busy=false;beginTurn(true);
}

/* ---- final en el centro ---- */
async function finalRun(){
  S.busy=true;S.state='moving';layer('pop',false);hint('','');const t=cur();const locs=[];let L=t.loc;
  if(L.k==='ring'){const o=L.i%6,fw=(6-o)%6,bk=o,dir=fw<=bk?1:-1,n=Math.min(fw,bk);let i=L.i;for(let k=0;k<n;k++){i=(i+dir+RING)%RING;locs.push({k:'ring',i})}const s=i/6;for(let j=3;j>=0;j--)locs.push({k:'spoke',s,j});t.lastSpoke=s}
  else if(L.k==='spoke'){for(let j=L.j-1;j>=0;j--)locs.push({k:'spoke',s:L.s,j});t.lastSpoke=L.s}
  if(L.k!=='hub')locs.push({k:'hub'});
  if(locs.length)await walkPath(t,locs);
  const ci=Math.random()*6|0;popMsg('Pregunta final',`${S.cats[ci].emoji} ${S.cats[ci].name}`);SFX.reveal();
  await wait(1900);S.busy=false;ask(ci,true);
}

/* ---- elegir categoría ---- */
function openPick(title){layer('pop',false);S.state='pick';const t=cur();S.pickSel=Math.max(0,S.cats.findIndex((c,j)=>!t.stars.has(j)));
  $('#pickT').textContent=title+': ¿qué categoría?';
  $('#pcats').innerHTML=S.cats.map((c,j)=>`<div class="pcat" data-click data-j="${j}" style="--cc:${c.color}"><span class="e">${c.emoji}</span>${c.name}</div>`).join('');
  $$('.pcat').forEach(el=>el.onclick=()=>{S.pickSel=+el.dataset.j;renderPick();choosePick()});
  renderPick();layer('pick',true);hint(' siguiente categoría',' elegir')}
function renderPick(){$$('.pcat').forEach((el,j)=>el.classList.toggle('sel',j===S.pickSel))}
function movePick(d){S.pickSel=(S.pickSel+d+6)%6;SFX.tap();renderPick()}
function choosePick(){if(S.state!=='pick')return;SFX.hold();layer('pick',false);ask(S.pickSel,false)}

/* ---- preguntas ---- */
function fromPool(key,pool){S.used[key]=S.used[key]||[];if(S.used[key].length>=pool.length)S.used[key]=[];
  const av=pool.map((_,i)=>i).filter(i=>!S.used[key].includes(i));const i=rnd(av);S.used[key].push(i);return pool[i]}
function mk(row){const[q,c,...w]=row;const o=shuffle([c,...w]);return{q,opts:o,correct:o.indexOf(c),answer:c}}
function normalQ(ci,d){const id=BASECATS[ci].id;const pool=Q[id][d].concat(QX[id][d]);return{...mk(fromPool(id+d,pool)),d}}
function vfQ(ci){const pool=VF.filter(v=>v[0]===ci);if(!pool.length)return null;const v=fromPool('vf'+ci,pool);return{q:v[1],opts:['Verdadero','Falso'],correct:v[2]?0:1,answer:v[2]?'Verdadero':'Falso',vf:true}}
function ask(ci,final){
  const d=S.diff==='x'?rnd(['f','m','d']):S.diff;let q=null;
  if(!final){const r=Math.random();
    if(S.mode==='uni'&&r<.16)q={...mk(fromPool('trick',TRICK)),trick:true,correct:-1};
    else if(S.mode==='xmas'&&r<.5)q={...mk(fromPool('x'+ci,XQC[ci])),xmas:true};
    else if(r>.84)q=vfQ(ci)}
  if(!q)q=normalQ(ci,d);
  showQ({...q,cat:ci,final,d:q.d||d,head:'cat'});
}
function askReto(reward){const pool=RETOS.base.concat(S.mode==='xmas'?RETOS.xmas:S.mode==='uni'?RETOS.uni.concat(RETOS.uni):[]);
  const txt=fromPool('reto'+S.mode,pool);showQ({kind:'reto',q:txt,opts:['¡Reto superado!','No lo han conseguido'],correct:0,head:reward?'magicreto':'reto',reward})}
function showQ(q){
  layer('pop',false);S.q=q;S.state='question';S.sel=0;renderHUD();const t=cur();const card=$('#qcard');let headHTML;
  if(q.head==='cat'){const c=S.cats[q.cat];card.style.setProperty('--cc',c.color);const lvl={f:1,m:2,d:3}[q.d]||2;
    headHTML=`<span class="ci">${c.emoji}</span><span class="cn">${c.name}</span>${q.xmas?'<span class="qtag">🎄 Navideña</span>':q.vf?'<span class="qtag">Verdadero o falso</span>':`<span class="lv">${[1,2,3].map(n=>`<i class="${n<=lvl?'on':''}"></i>`).join('')}</span>`}`}
  else if(q.head==='fam'){card.style.setProperty('--cc','#ff5f8f');headHTML=`<span class="ci">💛</span><span class="cn">Familia</span><span class="qtag">¿Quién conoce mejor a la familia?</span>`}
  else{card.style.setProperty('--cc',q.head==='magicreto'?'#b596ff':'#19C2B0');headHTML=`<span class="ci">${q.head==='magicreto'?'🦄':'🎭'}</span><span class="cn">${q.head==='magicreto'?'Reto unicornio':'Reto'}</span><span class="qtag">${q.reward?'Premio: un quesito gratis':'Premio: seguir jugando'}</span>`}
  $('#qhead').className='qhead'+(q.head==='magicreto'?' rainbow':'');$('#qhead').innerHTML=headHTML;
  $('#qteam').innerHTML=`<span class="hd">${t.emoji}</span>${q.kind==='reto'?'Hacen el reto':'Contestan'} <b>${esc(t.name)}</b>${q.final?'<span class="fin">🏆 Pregunta final</span>':''}`;
  const qt=$('#qText');qt.textContent=q.q;qt.classList.toggle('long',q.q.length>72);
  $('#opts').className='opts'+(q.opts.length===2?' two':'');
  $('#opts').innerHTML=q.opts.map((o,i)=>`<div class="opt" data-click data-i="${i}"><span class="l">${q.kind==='reto'?(i?'✗':'✓'):'ABCD'[i]}</span><span class="t">${esc(o)}</span></div>`).join('');
  $$('.opt').forEach(el=>el.onclick=()=>{if(S.state!=='question')return;S.sel=+el.dataset.i;renderSel();answer(S.sel)});
  $('#qmsg').textContent=q.kind==='reto'?'Los demás equipos deciden si lo han conseguido':'Toca para moverte entre respuestas y mantén pulsado para contestar';$('#verdict').className='verdict';
  renderSel();layer('qlay',true);SFX.reveal();hint(' siguiente opción',q.kind==='reto'?' confirmar':' responder');
}
function renderSel(){$$('.opt').forEach((el,i)=>el.classList.toggle('sel',i===S.sel))}
function moveSel(d){const n=S.q.opts.length;S.sel=(S.sel+d+n)%n;SFX.tap();renderSel()}
function verdict(txt,col){const v=$('#verdict');v.textContent=txt;v.style.setProperty('--vc',col);v.className='verdict on'}
function answer(i){
  if(S.state!=='question')return;S.state='result';const q=S.q,t=cur(),msg=$('#qmsg');const opts=$$('.opt');
  if(q.trick){opts.forEach(el=>{el.classList.remove('sel');el.classList.add('trick')});SFX.trick();verdict('¡Era trampa! 🦄','#c04bd8');
    msg.innerHTML='Esta no cuenta, solo era para reírse un rato. <b>Seguís jugando.</b>';S.after='keep';mood(t,'yay',2000);
    const r=$('#qcard').getBoundingClientRect();CF.burst(r.left+r.width/2,r.top+r.height/2,160,['#ff8fcb','#ffd25e','#6ee0a2','#76c7ff','#b596ff','#fff']);hint(' seguir jugando','');return}
  if(q.kind==='reto'){const ok=i===0;opts.forEach((el,j)=>{el.classList.remove('sel');el.classList.add(j===i?(ok?'right':'wrong'):'fade')});mood(t,ok?'yay':'sad',2400);
    if(ok){SFX.right();verdict('¡Superado!','#1fa857');const r=opts[0].getBoundingClientRect();CF.burst(r.left+r.width/2,r.top,120);
      if(q.reward){const miss=[0,1,2,3,4,5].filter(k=>!t.stars.has(k));if(miss.length){const k=rnd(miss);t.stars.add(k);flyQ(r.left+r.width/2,r.top,k);msg.innerHTML=`¡Quesito gratis de <b>${S.cats[k].name}</b>! Seguís jugando`}else msg.innerHTML='Ya teníais todos los quesitos. ¡Seguís jugando!'}
      else msg.innerHTML='¡Muy bien! <b>Seguís jugando</b>';S.after='keep';
      if(t.stars.size>=S.goal)hint(' ir a por la pregunta final','');else hint(' seguir jugando','')}
    else{SFX.wrong();verdict('¡Otra vez será!','#e8283c');msg.innerHTML='Pasa el turno al siguiente equipo';S.after='pass';hint(' pasar turno','')}
    return}
  const ok=i===q.correct;S.after=ok?'keep':'pass';
  opts.forEach((el,j)=>{el.classList.remove('sel');if(j===q.correct)el.classList.add('right');else if(j===i)el.classList.add('wrong');else el.classList.add('fade')});
  verdict(ok?rnd(CHEERS):rnd(FAILS),ok?'#1fa857':'#e8283c');mood(t,ok?'yay':'sad',2600);
  if(ok){SFX.right();t.right++;const r=opts[q.correct].getBoundingClientRect();CF.burst(r.left+r.width/2,r.top+r.height/2,120);
    if(q.final){msg.innerHTML=`¡<b>${esc(t.name)}</b> gana la partida!`;S.busy=true;hint('','');setTimeout(()=>{S.busy=false;win()},2000);return}
    if(q.kind==='fam'){msg.innerHTML='¡Cómo os conocéis! <b>Seguís jugando</b>'}
    else{const isNew=!t.stars.has(q.cat);if(isNew){t.stars.add(q.cat);flyQ(r.left+r.width/2,r.top,q.cat);msg.innerHTML=`¡Ganáis el quesito de <b>${S.cats[q.cat].name}</b> y seguís jugando!`}else msg.innerHTML='Ese quesito ya lo teníais, pero <b>seguís jugando</b>'}
    hint(t.stars.size>=S.goal?' ir a por la pregunta final':' seguir jugando','');
  }else{SFX.wrong();msg.innerHTML=`La respuesta era <b>${esc(q.answer)}</b>`;hint(' pasar al siguiente equipo','')}
}
function flyQ(x,y,ci){const el=document.createElement('div');el.className='flyq';el.innerHTML=`<svg viewBox="0 0 48 48" width="64" height="64"><path d="M24 24 L24 2 A22 22 0 0 1 43 13 Z" fill="${S.cats[ci].color}" stroke="#fff" stroke-width="3"/></svg>`;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  const tgt=$('#tc'+S.turn+' .q');const r=tgt?tgt.getBoundingClientRect():{left:innerWidth/2,top:0,width:0,height:0};const dx=r.left+r.width/2-x,dy=r.top+r.height/2-y;
  el.animate([{transform:'translate(0,0) scale(.4) rotate(0)'},{transform:`translate(${dx*.3}px,${dy*.3-160}px) scale(2) rotate(200deg)`,offset:.35},{transform:`translate(${dx}px,${dy}px) scale(.5) rotate(360deg)`}],{duration:1200,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{el.remove();SFX.star();renderHUD();const c=$('#tc'+S.turn);c&&c.animate([{transform:'scale(1.35)'},{transform:'scale(1.14) translateY(.3rem)'}],{duration:400})}}
async function afterResult(){layer('qlay',false);clearHot();SFX.tap();const t=cur();
  if(S.after==='keep'){beginTurn(true);return}
  if(S.q&&S.q.final&&t.loc.k==='hub'){S.busy=true;const s=t.lastSpoke??t.spoke;await walkPath(t,[0,1,2,3].map(j=>({k:'spoke',s,j})).concat([{k:'ring',i:s*6}]));S.busy=false}
  S.turn=(S.turn+1)%S.teams.length;beginTurn(false)}

/* ---- victoria ---- */
function win(){
  closeAll();S.state='win';const t=cur();renderHUD();document.body.classList.remove('ingame');
  const w=$('#win');w.style.setProperty('--pc',t.color);w.style.setProperty('--pl',light(t.color,.25));
  const rank=S.teams.slice().sort((a,b)=>b.stars.size-a.stars.size||b.right-a.right);
  $('#wbox').innerHTML=`<div class="wchar"><div class="ch yay">${charSVG(t,THEMES[S.mode].hat,'win')}</div></div><div class="wt">¡Victoria para ${esc(t.name)}!</div>
    <div class="rank">${rank.map(o=>`<div class="tc" style="--pc:${o.color}"><div class="hd">${o.emoji}</div><span class="nm">${esc(o.name)}</span>${quesera(o)}<span class="cnt">${o.stars.size}</span></div>`).join('')}</div>`;
  layer('win',true);$('#hud').classList.add('off');SFX.fanfare();CF.rain(6000);hint(' revancha',' volver al menú');
}

/* ================= ARRANQUE ================= */
goIntro();loadFam();

</script>
