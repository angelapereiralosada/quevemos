<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qué vemos">
<title>¿Qué vemos?</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<!-- ENTRADA -->
<section id="login" class="login" hidden>
  <div class="login-in">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 class="login-title">¿Qué <em>vemos</em>?</h1>
    <p class="login-sub" id="loginSub">¿Quién eres?</p>
    <div class="who" id="who"></div>
    <div class="pinbox" id="pinbox" hidden>
      <div class="pindots" id="pindots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
      <p class="pin-err" id="pinerr" role="alert"></p>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <span class="brand"><span class="mark sm" aria-hidden="true"><i></i><i></i><i></i></span>qué <em>vemos</em></span>
    <div class="top-r">
      <button class="icon-btn" id="searchBtn" aria-label="Buscar un título"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></button>
      <button class="me" id="meBtn" aria-label="Perfil y ajustes"></button>
    </div>
  </header>

  <main>
    <section class="view" id="v-discover"></section>
    <section class="view" id="v-top" hidden></section>
    <section class="view" id="v-mine" hidden></section>
    <section class="view" id="v-all" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-v="discover" aria-current="page"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm5 5.2c-1-1.4-3.6-1-3.6 1.2 0 1.9 2.3 3.4 3.6 4.4 1.3-1 3.6-2.5 3.6-4.4 0-2.2-2.6-2.6-3.6-1.2z"/></svg><span>Descubrir</span></button>
    <button data-v="top"><svg viewBox="0 0 24 24"><path d="M13.5 2c.5 3-1.5 4.4-2.6 5.8C9.6 9.4 9 10.7 9 12a3 3 0 0 0 6 0c0-.8-.2-1.4-.5-2 2.3 1.2 4.5 3.7 4.5 7a7 7 0 0 1-14 0c0-5.3 4.9-7.6 8.5-15z"/></svg><span>Top</span></button>
    <button data-v="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span>Mi lista</span></button>
    <button data-v="all"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg><span>Todos</span><b class="badge" id="allBadge" hidden></b></button>
  </nav>
</div>

<!-- HOJA (detalle, chat, búsqueda, ajustes) -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
