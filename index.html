<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qué vemos">
<title>¿Qué vemos?</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ENTRADA -->
<section id="login" class="login" hidden>
  <div class="login-in">
    <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 class="login-title">¿Qué vemos?</h1>
    <p class="login-sub">¿Quién eres?</p>
    <div class="who" id="who"></div>
    <div class="pinbox" id="pinbox" hidden>
      <p class="login-sub">PIN de casa</p>
      <div class="pindots" id="pindots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
      <p class="pin-err" id="pinerr" role="alert"></p>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <button class="brand" id="goHome" aria-label="Ir a inicio"><span class="logo sm" aria-hidden="true"><span></span><span></span><span></span></span>¿Qué vemos?</button>
    <button class="me" id="meBtn" aria-label="Perfil y ajustes"></button>
  </header>

  <main id="views">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-find" hidden></section>
    <section class="view" id="v-common" hidden></section>
    <section class="view" id="v-mine" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button data-v="find"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 18.5 12 15.6 7 18.5l1.4-5.7L4 9l5.8-.7z"/></svg><span>Elegir</span></button>
    <button data-v="common"><svg viewBox="0 0 24 24"><path d="M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3.3 2.7-6 6-6s6 2.7 6 6zm13 0c0-1.9-.6-3.6-1.7-5 .5-.1 1.1-.2 1.7-.2 3 0 5.5 2.3 5.5 5.2z"/></svg><span>Común</span><b class="badge" id="commonBadge" hidden></b></button>
    <button data-v="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span>Mi lista</span></button>
  </nav>
</div>

<!-- HOJA DE DETALLE / AJUSTES -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Cerrar">×</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
