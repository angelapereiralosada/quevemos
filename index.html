<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qué vemos">
<title>¿Qué vemos?</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bungee&family=Permanent+Marker&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body data-view="discover">

<!-- ENTRADA: carnet de socio -->
<section id="login" class="login" hidden>
  <div class="login-in">
    <h1 class="login-title"><span class="sign-box">VIDEOCLUB</span><b>¿Qué vemos?</b></h1>
    <p class="login-sub" id="loginSub">Enseña tu carnet de socio</p>
    <div class="who" id="who"></div>
    <div class="pinbox" id="pinbox" hidden>
      <div class="lcd-screen"><div class="pindots" id="pindots" aria-live="polite"><i></i><i></i><i></i><i></i></div></div>
      <p class="pin-err" id="pinerr" role="alert"></p>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <span class="brand"><span class="sign-box">¿QUÉ VEMOS?</span></span>
    <div class="top-r">
      <button class="icon-btn" id="bellBtn" aria-label="Novedades"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><span class="dotn" id="bellN" hidden></span></button>
      <button class="icon-btn" id="searchBtn" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></button>
      <button class="me" id="meBtn" aria-label="Mi carnet y ajustes"></button>
    </div>
  </header>

  <main>
    <section class="view" id="v-discover"></section>
    <section class="view" id="v-top" hidden></section>
    <section class="view" id="v-lists" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-v="discover" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm4 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm10 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm-6 3.5v1h2v-1z"/></svg><span>Descubrir</span></button>
    <button data-v="top"><svg viewBox="0 0 24 24"><path d="M5 3h14v2h2v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 15v3h3v3H8v-3h3v-3a5 5 0 0 1-3.7-3H7a4 4 0 0 1-4-4V5h2zm0 4v1a2 2 0 0 0 2 2V7zm14 0h-2v3a2 2 0 0 0 2-2z"/></svg><span>Top 10</span></button>
    <button data-v="lists"><svg viewBox="0 0 24 24"><path d="M3 19h18v2H3zM5 5h3v13H5zm4 2h3v11H9zm4-3h3v14h-3zm4.5 2.5 2.9-.8 3 11.6-2.9.7z"/></svg><span>Listas</span></button>
  </nav>
</div>

<!-- HOJA -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="tour" id="tour" role="dialog" aria-modal="true" aria-label="Tutorial" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<canvas id="confetti" hidden></canvas>

<script src="config.js?v=9"></script>
<script src="app.js?v=14"></script>
</body>
</html>
