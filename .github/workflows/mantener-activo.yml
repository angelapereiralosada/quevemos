# Supabase pausa los proyectos gratuitos tras 7 días sin uso.
# Esto hace una consulta mínima cada 3 días para que la base de datos no se duerma.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base de datos
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            "https://qhmuszfjgeadchpnyivp.supabase.co/rest/v1/rpc/qv_login" \
            -H "apikey: sb_publishable_eyAgXaN11XIMebtj_SCUhQ_b7eLXuQH" \
            -H "Content-Type: application/json" \
            -d '{"p_pin":"0000"}'
